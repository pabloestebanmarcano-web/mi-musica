<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Mi música">
<meta name="theme-color" content="#FFFFFF">
  <link rel="apple-touch-icon" href="icono.png"><title>Mi música</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700&family=Figtree:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#FFFFFF; --ink:#16141F; --muted:#6B6878; --surface:#F4F3F7; --line:#E7E5ED;
  --accent:#2F6B4F; --on-accent:#FFFFFF; --tint:#DCEBE2; --danger:#B3261E;
  color-scheme: light;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#121114; --ink:#F2F1F5; --muted:#A6A3B2; --surface:#1E1D23; --line:#2C2A33;
    --accent:#6FBF93; --on-accent:#0E1F16; --tint:#1F3A2C; --danger:#FF8A80; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#121114; --ink:#F2F1F5; --muted:#A6A3B2; --surface:#1E1D23; --line:#2C2A33;
  --accent:#6FBF93; --on-accent:#0E1F16; --tint:#1F3A2C; --danger:#FF8A80; color-scheme:dark;
}
*,*::before,*::after{box-sizing:border-box}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;height:100%;background:var(--bg);color:var(--ink);font-family:'Figtree',system-ui,-apple-system,sans-serif;font-size:15px;-webkit-tap-highlight-color:transparent}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
button,input{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
h1,h2,h3{font-family:'Bricolage Grotesque',system-ui,sans-serif;margin:0}
.app{max-width:560px;margin:0 auto;height:100%;display:flex;flex-direction:column}
main{flex:1;overflow-y:auto;padding:24px 22px 24px;-webkit-overflow-scrolling:touch}
.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:22px;gap:12px}
.top h1{font-size:34px;font-weight:700;letter-spacing:-.8px;line-height:1}
.iconbtn{width:44px;height:44px;border-radius:22px;border:1px solid var(--line);background:var(--bg);display:flex;align-items:center;justify-content:center;flex-shrink:0}
.iconbtn.plain{border:none;background:transparent}
.search{display:flex;align-items:center;gap:10px;background:var(--surface);border-radius:12px;padding:0 14px;height:44px;margin-bottom:28px}
.search input{flex:1;background:transparent;border:none;outline:none;font-size:16px;min-width:0}
.search input::placeholder{color:var(--muted)}
section{margin-bottom:30px}
.sechead{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:12px}
.sechead h2{font-size:19px;font-weight:600}
.link{background:none;border:none;color:var(--muted);font-size:14px;padding:10px 0}
.row{display:flex;align-items:center;gap:14px;width:100%;min-height:58px;padding:6px 0;background:none;border:none;text-align:left}
.row .meta{flex:1;min-width:0;display:flex;flex-direction:column}
.row .t{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .s{font-size:13px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row.playing .t{color:var(--accent)}
.songrow{display:flex;align-items:center;gap:4px}
.songrow .row{flex:1;min-width:0}
.cover{position:relative;overflow:hidden;flex-shrink:0;border-radius:10px}
.cover i{position:absolute;display:block}
.gen .blob{position:absolute;left:16%;top:16%;width:68%;height:68%;background:var(--accent);border-radius:42% 58% 63% 37%/45% 41% 59% 55%;animation:morph 9s ease-in-out infinite alternate;will-change:border-radius,transform}
@keyframes morph{
  0%{border-radius:42% 58% 63% 37%/45% 41% 59% 55%;transform:rotate(0deg) scale(1)}
  25%{border-radius:63% 37% 41% 59%/57% 60% 40% 43%;transform:rotate(40deg) scale(1.05)}
  50%{border-radius:37% 63% 52% 48%/40% 52% 48% 60%;transform:rotate(95deg) scale(.95)}
  75%{border-radius:55% 45% 35% 65%/62% 38% 62% 38%;transform:rotate(140deg) scale(1.03)}
  100%{border-radius:46% 54% 58% 42%/38% 57% 43% 62%;transform:rotate(180deg) scale(1)}
}
.player .big .blob{animation-duration:6s}
.player.paused .blob{animation-play-state:paused}
@media (prefers-reduced-motion: reduce){.gen .blob{animation:none}}
.recent{display:flex;gap:14px;overflow-x:auto;padding-bottom:4px;margin:0 -22px;padding-left:22px;padding-right:22px;scrollbar-width:none}
.recent::-webkit-scrollbar{display:none}
.card{width:132px;flex-shrink:0;background:none;border:none;padding:0;text-align:left;display:flex;flex-direction:column;gap:10px}
.card .t{font-weight:600;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card .s{font-size:13px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.empty{border:1px dashed var(--line);border-radius:16px;padding:28px 20px;text-align:center;color:var(--muted)}
.empty h3{color:var(--ink);font-size:18px;margin-bottom:6px}
.btn{height:46px;padding:0 20px;border-radius:23px;border:none;background:var(--accent);color:var(--on-accent);font-weight:600}
.btn.ghost{background:var(--surface);color:var(--ink)}
.btn.danger{background:transparent;color:var(--danger);border:1px solid var(--line)}
.mini{margin:0 12px 8px;display:flex;align-items:center;gap:12px;height:64px;padding:0 6px 0 8px;border-radius:16px;background:var(--surface)}
.mini .open{flex:1;min-width:0;display:flex;align-items:center;gap:12px;background:none;border:none;text-align:left;padding:0;height:100%}
.mini .bar{position:absolute;left:14px;right:14px;bottom:0;height:2px;background:var(--line);border-radius:1px;overflow:hidden}
nav.tabs{display:flex;justify-content:space-around;padding:2px 0 10px;background:var(--bg)}
nav.tabs button{display:flex;flex-direction:column;align-items:center;gap:3px;min-width:72px;padding-top:8px;background:none;border:none;color:var(--muted);font-size:12px;font-weight:500}
nav.tabs button[aria-current="page"]{color:var(--accent);font-weight:600}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(150px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:12px 18px;border-radius:14px;font-size:14px;max-width:calc(100% - 40px);z-index:50;box-shadow:0 6px 24px rgba(0,0,0,.18)}
.sheet-wrap{position:fixed;inset:0;z-index:40;background:rgba(10,10,14,.35);display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--bg);width:100%;max-width:560px;border-radius:24px 24px 0 0;padding:20px 22px calc(24px + env(safe-area-inset-bottom,0px));max-height:85%;overflow-y:auto}
.sheet h3{font-size:20px;margin-bottom:14px}
.field{display:flex;flex-direction:column;gap:6px;margin-bottom:14px}
.field label{font-size:13px;color:var(--muted)}
.field input{height:46px;border-radius:12px;border:1px solid var(--line);background:var(--bg);padding:0 14px;font-size:16px}
.actions{display:flex;gap:10px;justify-content:flex-end;margin-top:6px;flex-wrap:wrap}
.player{position:fixed;inset:0;z-index:30;background:var(--bg);display:flex;justify-content:center;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
.player .in{width:100%;max-width:440px;display:flex;flex-direction:column;gap:26px;padding:12px 26px 28px;overflow-y:auto}
.player .head{display:flex;justify-content:space-between;align-items:center}
.player .src{font-size:13px;color:var(--muted)}
.player .big{width:100%;aspect-ratio:1/1;border-radius:24px}
.titleline{display:flex;justify-content:space-between;align-items:center;gap:10px}
.titleline h2{font-size:26px;font-weight:700;letter-spacing:-.4px;line-height:1.1;overflow-wrap:anywhere}
.titleline .a{color:var(--muted);margin-top:4px}
input[type=range]{width:100%;-webkit-appearance:none;appearance:none;height:24px;background:transparent;margin:0}
input[type=range]::-webkit-slider-runnable-track{height:4px;border-radius:2px;background:linear-gradient(var(--ink),var(--ink)) 0/var(--p,0%) 100% no-repeat,var(--line)}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:14px;height:14px;border-radius:7px;background:var(--ink);margin-top:-5px}
input[type=range]::-moz-range-track{height:4px;border-radius:2px;background:var(--line)}
input[type=range]::-moz-range-progress{height:4px;background:var(--ink)}
input[type=range]::-moz-range-thumb{width:14px;height:14px;border:none;border-radius:7px;background:var(--ink)}
.times{display:flex;justify-content:space-between;font-size:12px;color:var(--muted);margin-top:2px}
.controls{display:flex;justify-content:space-between;align-items:center}
.ctrl{width:52px;height:52px;border:none;background:none;display:flex;align-items:center;justify-content:center;color:var(--ink)}
.ctrl.small{width:44px;height:44px;color:var(--muted)}
.ctrl.small.on{color:var(--accent)}
.play{width:72px;height:72px;border-radius:36px;border:none;background:var(--accent);color:var(--on-accent);display:flex;align-items:center;justify-content:center}
.next{display:flex;align-items:center;gap:12px;border-top:1px solid var(--line);padding-top:18px}
.progress{height:3px;background:var(--line);border-radius:2px;overflow:hidden;margin-top:10px}
.progress div{height:100%;background:var(--accent);width:0}
.pickrow{display:flex;align-items:center;gap:12px;min-height:52px;width:100%;background:none;border:none;text-align:left;padding:4px 0}
.check{width:22px;height:22px;border-radius:6px;border:1.5px solid var(--line);display:flex;align-items:center;justify-content:center;flex-shrink:0}
.check.on{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.backline{display:flex;align-items:center;gap:6px;margin-bottom:16px}
.status{font-size:13px;color:var(--muted);margin-top:-18px;margin-bottom:22px}
.seg{display:flex;background:var(--surface);border-radius:12px;padding:3px;margin:-12px 0 22px}
.seg button{flex:1;height:38px;border:none;background:transparent;border-radius:9px;font-weight:500;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--bg);color:var(--ink);font-weight:600;box-shadow:0 1px 3px rgba(0,0,0,.10)}
.albums{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px 14px}
.albums .card{width:auto}
.albums .card .cover{width:100% !important;height:auto !important;aspect-ratio:1/1}
.extras{display:flex;justify-content:space-around;margin-top:-8px}
.extra{display:flex;flex-direction:column;align-items:center;gap:4px;min-width:76px;min-height:48px;background:none;border:none;color:var(--muted);font-size:12px;font-weight:500}
.extra.on{color:var(--accent);font-weight:600}
.grab{width:40px;height:5px;border-radius:3px;background:var(--line);margin:0 auto -14px}
.player{transition:transform .25s ease}
.player.dragging{transition:none}
.big{transition:transform .2s ease}
.qrow{display:flex;align-items:center;gap:10px;min-height:56px}
.qrow .row{flex:1;min-width:0;min-height:52px}
.lyrics{white-space:pre-line;font-size:18px;line-height:1.6;margin:0}
:root[data-accent="azul"]{--accent:#1F4FD8;--tint:#DCE5FF}
:root[data-accent="petroleo"]{--accent:#0F6E7A;--tint:#D6ECEE}
:root[data-accent="mono"]{--accent:#16141F;--tint:#E7E5ED}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"])[data-accent="azul"]{--accent:#8EA8FF;--tint:#1E2A4A;--on-accent:#0B1430}
  :root:not([data-theme="light"])[data-accent="petroleo"]{--accent:#5FC3CF;--tint:#163A3F;--on-accent:#06242A}
  :root:not([data-theme="light"])[data-accent="mono"]{--accent:#F2F1F5;--tint:#2C2A33;--on-accent:#121114}
}
:root[data-theme="dark"][data-accent="azul"]{--accent:#8EA8FF;--tint:#1E2A4A;--on-accent:#0B1430}
:root[data-theme="dark"][data-accent="petroleo"]{--accent:#5FC3CF;--tint:#163A3F;--on-accent:#06242A}
:root[data-theme="dark"][data-accent="mono"]{--accent:#F2F1F5;--tint:#2C2A33;--on-accent:#121114}
.noanim .gen .blob{animation:none}
.setgroup{margin-bottom:28px}
.setgroup h2{font-size:17px;font-weight:600;margin-bottom:6px}
.setrow{display:flex;align-items:center;justify-content:space-between;gap:14px;min-height:56px;padding:8px 0;border-bottom:1px solid var(--line)}
.setrow:last-child{border-bottom:none}
.setrow .lab{display:flex;flex-direction:column;gap:2px;min-width:0}
.setrow .lab small{color:var(--muted);font-size:13px}
.setbtn{width:100%;background:none;border:none;text-align:left;cursor:pointer}
.switch{width:52px;height:32px;border-radius:16px;border:none;background:var(--line);position:relative;flex-shrink:0;padding:0}
.switch::after{content:"";position:absolute;top:3px;left:3px;width:26px;height:26px;border-radius:13px;background:#FFFFFF;box-shadow:0 1px 3px rgba(0,0,0,.25);transition:left .18s ease}
.switch[aria-checked="true"]{background:var(--accent)}
.switch[aria-checked="true"]::after{left:23px}
.mini-seg{display:flex;background:var(--surface);border-radius:10px;padding:3px;flex-shrink:0}
.mini-seg button{height:34px;padding:0 11px;border:none;background:transparent;border-radius:8px;font-size:13px;color:var(--muted)}
.mini-seg button[aria-pressed="true"]{background:var(--bg);color:var(--ink);font-weight:600;box-shadow:0 1px 3px rgba(0,0,0,.10)}
.swatches{display:flex;gap:10px;flex-shrink:0}
.swatch{width:34px;height:34px;border-radius:17px;border:2px solid transparent;padding:3px;background:none}
.swatch span{display:block;width:100%;height:100%;border-radius:50%}
.swatch[aria-pressed="true"]{border-color:var(--ink)}
.meter{height:8px;border-radius:4px;background:var(--surface);overflow:hidden;margin:10px 0 6px}
.meter div{height:100%;background:var(--accent);border-radius:4px}
.bulkbar{position:sticky;bottom:0;background:var(--bg);padding:12px 0 4px;display:flex;gap:10px;align-items:center;justify-content:space-between;border-top:1px solid var(--line);margin-top:8px}
.btn[disabled]{opacity:.45;cursor:default}
.lyrhead{display:flex;align-items:center;gap:12px}
.lyrhead .meta{flex:1;min-width:0;display:flex;flex-direction:column}
.lyr{position:relative;flex:1;min-height:180px;overflow-y:auto;-webkit-mask-image:linear-gradient(transparent,#000 14%,#000 86%,transparent);mask-image:linear-gradient(transparent,#000 14%,#000 86%,transparent);scrollbar-width:none;overscroll-behavior:contain}
.lyr::-webkit-scrollbar{display:none}
.lyr .ln{display:block;width:100%;text-align:left;background:none;border:none;padding:6px 0;margin:0 0 6px;font-family:'Bricolage Grotesque',system-ui,sans-serif;font-size:25px;font-weight:700;line-height:1.25;letter-spacing:-.3px;color:var(--ink);opacity:.28;transition:opacity .3s ease,transform .3s ease;transform-origin:left center}
.lyr .ln.past{opacity:.4}
.lyr .ln.on{opacity:1;transform:scale(1.03)}
.lyr .ln.gap{font-size:20px;letter-spacing:4px}
.lyr.plain p{white-space:pre-line;font-size:18px;line-height:1.65;margin:0;color:var(--ink)}
@media (prefers-reduced-motion: reduce){.lyr .ln{transition:none}.lyr .ln.on{transform:none}}
</style>
</head>
<body>
<div class="app">

  <div id="miniSlot"></div>

(function(){

async function refreshUsage(){try{if(S.assets){const r=await S.assets.list();S.usage=r.usage;render()}}catch(e){}}

const ICON={
  plus:'<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>',

  play:'<svg width="22" height="22" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M7 5v14l12-7z"/></svg>',
  pause:'<svg width="22" height="22" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><rect x="6" y="5" width="4" height="14" rx="1"/><rect x="14" y="5" width="4" height="14" rx="1"/></svg>',
  prev:'<svg width="28" height="28" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M18 6v12l-9-6z"/><rect x="5" y="6" width="2.2" height="12" rx="1"/></svg>',
  next:'<svg width="28" height="28" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M6 6v12l9-6z"/><rect x="16.8" y="6" width="2.2" height="12" rx="1"/></svg>',
  shuffle:'<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M16 4h4v4M4 20L20 4M20 16v4h-4M4 4l6 6M14 14l6 6"/></svg>',

/* ---------- Portadas generadas ---------- */
function hash(s){let h=2166136261;for(const c of String(s)){h^=c.charCodeAt(0);h=Math.imul(h,16777619)}return h>>>0}
function art(song,size,radius){
  const r=radius??Math.max(8,Math.round(size*0.12));
  if(song&&song.coverId&&song.coverBlobUrl) return `<span class="cover" aria-hidden="true" style="width:${size}px;height:${size}px;border-radius:${r}px;background:var(--surface);display:block"><img src="${esc(song.coverBlobUrl)}" alt="" loading="lazy" style="width:100%;height:100%;object-fit:cover;display:block"></span>`;
  const ic=Math.round(size*0.3), delay=-(hash(song?song.id:"x")%9000)/1000;
  return `<span class="cover gen" aria-hidden="true" style="width:${size}px;height:${size}px;border-radius:${r}px;background:var(--tint);display:flex;align-items:center;justify-content:center"><span class="blob" style="animation-delay:${delay}s"></span><svg width="${ic}" height="${ic}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true" style="position:relative;color:var(--on-accent)"><path d="M9 18V5l11-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="17" cy="16" r="3"/></svg></span>`;
}
function listArt(p,size,radius){
  const first=(p.songIds||[]).map(byId).find(x=>x&&x.coverId);
  return first?art(first,size,radius):cover("lista"+p.id,size,radius);
}
const sub=s=>{const a=albumLabel(s);return esc(s.artist||"Artista desconocido")+(a?" · "+esc(a):"")};
function cover(seed,size,radius){
  const h=hash(seed), v=h%5, tone=Math.floor(h/5)%3;
  const bgs=["var(--accent)","var(--tint)","var(--ink)"], bg=bgs[tone];
  const fg=tone===1?"var(--accent)":"var(--bg)";
  const r=radius??Math.max(8,Math.round(size*0.12));
  const u=size/132; let inner="";
  if(v===0) inner=`<i style="width:${56*u}px;height:${56*u}px;border-radius:50%;background:${fg};left:${38*u}px;top:${38*u}px"></i>`;
  else if(v===1) inner=`<i style="width:100%;height:50%;left:0;top:50%;background:${fg}"></i>`;
  else if(v===2) inner=`<i style="width:${64*u}px;height:${64*u}px;border-radius:50%;border:${Math.max(1.5,2*u)}px solid ${fg};left:${32*u}px;top:${32*u}px"></i>`;
  else if(v===3) inner=`<i style="width:${110*u}px;height:${110*u}px;border-radius:50%;background:${fg};right:${-30*u}px;bottom:${-30*u}px"></i>`;
  else inner=`<i style="width:50%;height:100%;left:50%;top:0;background:${fg};border-radius:${size}px 0 0 ${size}px"></i>`;
  return `<span class="cover" aria-hidden="true" style="width:${size}px;height:${size}px;border-radius:${r}px;background:${bg};display:block">${inner}</span>`;
}

function songRow(s,ctx){
  const cur=current(), playing=cur&&cur.id===s.id;
  return `<div class="songrow"><button class="row${playing?" playing":""}" data-play="${esc(s.id)}" data-ctx="${esc(ctx)}">${art(s,44,8)}<span class="meta"><span class="t">${esc(s.title)}</span><span class="s">${sub(s)}</span></span><span class="s" style="font-size:13px;color:var(--muted);flex-shrink:0">${s.duration?fmt(s.duration):""}</span></button><button class="iconbtn plain" data-menu="${esc(s.id)}" aria-label="Opciones de ${esc(s.title)}">${ICON.dots}</button></div>`;
}
const norm=x=>String(x||"").toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"").replace(/\s+/g," ").trim();
const artistOf=s=>s.artist||"Artista desconocido";
function splitArtists(str){
  const re=CFG.splitAmp?/\s*(?:,|;|\/|\s&\s|\s(?:feat\.?|ft\.?|featuring|with|con|x|vs\.?)\s)\s*/i:/\s*(?:,|;|\/|\s(?:feat\.?|ft\.?|featuring|with|con|x|vs\.?)\s)\s*/i;
  const parts=String(str||"").split(re).map(x=>x.replace(/^[(\[]|[)\]]$/g,"").trim()).filter(Boolean);
  return parts.length?parts:["Artista desconocido"];
}
function groups(kind){
  const m=new Map();
  for(const x of S.songs){
    const names=kind==="artist"?splitArtists(x.artist):(x.album?[x.album]:[]);
    for(const name of names){
      const k=norm(name); if(!m.has(k))m.set(k,{kind,name,songs:[]});
      const g=m.get(k); if(!g.songs.includes(x))g.songs.push(x);
    }
  }
  const q=norm(S.q);
  return [...m.values()].filter(g=>!q||norm(g.name+" "+g.songs.map(artistOf).join(" ")).includes(q)).sort((a,b)=>a.name.localeCompare(b.name,"es"));
}
function groupSongs(g){
  const k=norm(g.name);
  return S.songs.filter(x=>g.kind==="artist"?splitArtists(x.artist).some(a=>norm(a)===k):norm(x.album)===k)
    .sort((a,b)=>g.kind==="artist"?((a.album||"~").localeCompare(b.album||"~","es")||a.title.localeCompare(b.title,"es")):((a.createdAt||0)-(b.createdAt||0)));
}
function mainArtist(list){const c={};for(const x of list){const a=artistOf(x);c[a]=(c[a]||0)+1}return Object.entries(c).sort((a,b)=>b[1]-a[1])[0]?.[0]||""}
function groupArt(list,size,radius){const f=list.find(x=>x.coverId);return art(f||list[0],size,radius)}
function renderGroup(){
  const g=S.group, list=groupSongs(g);
  if(!list.length){S.group=null;return ""}
  const n=list.length, sub=g.kind==="album"?esc(mainArtist(list))+" · ":"";
  let h=`<div class="backline"><button class="iconbtn plain" data-closegroup aria-label="Volver">${ICON.back}</button></div>`;
  h+=`<div style="display:flex;gap:18px;align-items:flex-end;margin-bottom:22px">${groupArt(list,120,g.kind==="artist"?60:16)}<div style="min-width:0"><p style="margin:0 0 4px;font-size:13px;color:var(--muted)">${g.kind==="artist"?"Artista":"Álbum"}</p><h1 style="font-size:28px;letter-spacing:-.5px;overflow-wrap:anywhere">${esc(g.name)}</h1><p style="color:var(--muted);margin:6px 0 0">${sub}${n} ${n===1?"canción":"canciones"}</p></div></div>`;
  h+=`<div style="display:flex;gap:10px;margin-bottom:18px"><button class="btn" data-playall="group">${ICON.play} <span style="vertical-align:middle">Reproducir</span></button><button class="btn ghost" data-shuffleall="group">Aleatorio</button></div>`;
  h+=list.map(x=>songRow(x,"group")).join("");
  return h;
}
function filtered(){
  const q=S.q.trim().toLowerCase();
  const list=[...S.songs].sort((a,b)=>a.title.localeCompare(b.title,"es"));
  return q?list.filter(s=>(s.title+" "+(s.artist||"")+" "+(s.album||"")).toLowerCase().includes(q)):list;
}

      let coverId="",coverType="";
      if(tags.pic){try{const c=await S.assets.upload(new Blob([tags.pic.data],{type:tags.pic.mime}),{type:tags.pic.mime});coverId=c.id;coverType=c.contentType}catch(e){}}
      await S.db.collection("songs").add({title,artist,album,coverId,coverType,lyrics:tags.lyrics||"",assetId:r.id,duration:dur,size:r.sizeBytes,createdAt:Date.now(),file:f.name});
    }catch(e){
      const c=e&&e.code;
      fails.push(f.name+(c==="unsupported_type"?" (formato no admitido)":c==="quota_exceeded"?" (no queda espacio en tu dispositivo)":c==="too_large"?" (demasiado grande)":""));
    }
  }
  S.uploading=null; render(); refreshUsage();
  const ok=files.length-fails.length-dups.length;
  if(fails.length||dups.length) showSheet(`<h3>${ok>0?(ok===1?"1 canción subida":ok+" canciones subidas"):"No se ha subido ninguna canción"}</h3>${dups.length?`<p style="margin:0 0 6px;font-weight:600">Ya las tenías, no se han vuelto a subir:</p><ul style="padding-left:18px;color:var(--muted);margin:0 0 16px">${dups.map(f=>`<li style="margin-bottom:6px">${esc(f)}</li>`).join("")}</ul>`:""}${fails.length?`<p style="margin:0 0 6px;font-weight:600">No se han podido subir:</p><ul style="padding-left:18px;color:var(--muted);margin:0 0 12px">${fails.map(f=>`<li style="margin-bottom:6px">${esc(f)}</li>`).join("")}</ul><p style="color:var(--muted);margin:0 0 16px;font-size:14px">Si el formato no está admitido, prueba a convertir la canción a M4A.</p>`:""}<div class="actions"><button class="btn" data-closesheet>Entendido</button></div>`);
  else toast(ok===1?"Canción subida":"Canciones subidas");
}

/* ---------- Gestos en el reproductor ---------- */
let G=null;
document.addEventListener("touchstart",e=>{
  if(!S.playerOpen||document.querySelector(".sheet-wrap")){G=null;return}
  const t=e.touches[0],inn=document.querySelector(".player .in");
  G={x:t.clientX,y:t.clientY,top:inn?inn.scrollTop:0,cover:!!e.target.closest(".big"),seek:!!e.target.closest("#seek,button,input,#lyr"),dir:null};
},{passive:true});
document.addEventListener("touchmove",e=>{
  if(!G||G.seek)return;
  const t=e.touches[0],dx=t.clientX-G.x,dy=t.clientY-G.y;
  if(!G.dir&&(Math.abs(dx)>10||Math.abs(dy)>10))G.dir=Math.abs(dx)>Math.abs(dy)?"h":"v";
  if(G.dir==="h"&&G.cover){const b=document.querySelector(".player .big");if(b){b.style.transition="none";b.style.transform=`translateX(${dx*.6}px)`}}
  if(G.dir==="v"&&dy>0&&G.top<=0){const p=document.querySelector(".player");if(p){p.classList.add("dragging");p.style.transform=`translateY(${dy*.7}px)`}}
},{passive:true});
document.addEventListener("touchend",e=>{
  if(!G)return; const g=G; G=null; if(g.seek)return;
  const t=e.changedTouches[0],dx=t.clientX-g.x,dy=t.clientY-g.y;
  const p=document.querySelector(".player"),b=document.querySelector(".player .big");
  if(b){b.style.transition="";b.style.transform=""}
  if(g.dir==="h"&&g.cover&&Math.abs(dx)>70){if(dx<0)next(false);else prev();return}
  if(g.dir==="v"&&g.top<=0&&dy>120){if(p){p.classList.remove("dragging");p.style.transform="translateY(100%)"}setTimeout(()=>{S.playerOpen=false;renderPlayer()},200);return}
  if(p){p.classList.remove("dragging");p.style.transform=""}
},{passive:true});

/* ---------- Conexión Local (IndexedDB) ---------- */
const idb = {
  db: null,
  init() {
    return new Promise((res, rej) => {
      const req = indexedDB.open("MiMusicaDB", 1);
      req.onupgradeneeded = e => {
        const db = e.target.result;
        if(!db.objectStoreNames.contains("songs")) db.createObjectStore("songs", {keyPath: "id"});
        if(!db.objectStoreNames.contains("playlists")) db.createObjectStore("playlists", {keyPath: "id"});
        if(!db.objectStoreNames.contains("assets")) db.createObjectStore("assets", {keyPath: "id"});
        if(!db.objectStoreNames.contains("state")) db.createObjectStore("state", {keyPath: "id"});
      };
      req.onsuccess = e => { this.db = e.target.result; res(); };
      req.onerror = () => rej(req.error);
    });
  },
  get(st, id) { return new Promise(res => { const req = this.db.transaction(st).objectStore(st).get(id); req.onsuccess = () => res(req.result); req.onerror = () => res(null); }); },
  getAll(st) { return new Promise(res => { const req = this.db.transaction(st).objectStore(st).getAll(); req.onsuccess = () => res(req.result); req.onerror = () => res([]); }); },
  put(st, data) { return new Promise(res => { const req = this.db.transaction(st, "readwrite").objectStore(st).put(data); req.onsuccess = () => res(); }); },
  delete(st, id) { return new Promise(res => { const req = this.db.transaction(st, "readwrite").objectStore(st).delete(id); req.onsuccess = () => res(); }); }
};

const coverCache = new Map();
let songListeners = [], playlistListeners = [];

const triggerSongs = async () => {
  const all = await idb.getAll("songs");
  for(const s of all) {
     if(s.coverId) {
        if(!coverCache.has(s.coverId)) {
           const asset = await idb.get("assets", s.coverId);
           if(asset) coverCache.set(s.coverId, URL.createObjectURL(asset.data));
        }
        s.coverBlobUrl = coverCache.get(s.coverId);
     }
  }
  S.songs = all;
  songListeners.forEach(cb => cb({docs: all.map(data => ({id: data.id, data: ()=>data})), metadata: {fromCache: false}}));
};

const triggerPlaylists = async () => {
  const all = await idb.getAll("playlists");
  all.sort((a,b)=>a.createdAt - b.createdAt);
  S.playlists = all;
  playlistListeners.forEach(cb => cb({docs: all.map(data => ({id: data.id, data: ()=>data}))}));
};

const mockDb = {
  collection: (name) => ({
    onSnapshot: (cb) => {
      if(name === "songs") { songListeners.push(cb); triggerSongs(); }
      if(name === "playlists") { playlistListeners.push(cb); triggerPlaylists(); }
    },
    orderBy: () => mockDb.collection(name),
    add: async (data) => {
      const id = Date.now().toString(36) + Math.random().toString(36).substring(2);
      data.id = id;
      await idb.put(name, data);
      if(name === "songs") triggerSongs();
      if(name === "playlists") triggerPlaylists();
      return {id};
    },
    doc: (id) => ({
      get: async () => {
        const data = await idb.get(name, id);
        return { exists: !!data, data: () => data };
      },
      set: async (data) => {
        data.id = id;
        await idb.put(name, data);
        if(name === "songs") triggerSongs();
        if(name === "playlists") triggerPlaylists();
      },
      update: async (data) => {
        const existing = await idb.get(name, id) || {};
        await idb.put(name, { ...existing, ...data, id });
        if(name === "songs") triggerSongs();
        if(name === "playlists") triggerPlaylists();
      },
      delete: async () => {
        await idb.delete(name, id);
        if(name === "songs") triggerSongs();
        if(name === "playlists") triggerPlaylists();
      }
    })
  }),
  doc: (path) => {
     const [col, id] = path.split("/");
     return mockDb.collection(col).doc(id);
  }
};

const mockAssets = {
  upload: async (file, opts) => {
    const id = Date.now().toString(36) + Math.random().toString(36).substring(2);
    await idb.put("assets", { id, data: file, sizeBytes: file.size, contentType: opts.type });
    return { id, sizeBytes: file.size, contentType: opts.type };
  },
  delete: async (id) => {
    await idb.delete("assets", id);
  },
  list: async () => {
    const all = await idb.getAll("assets");
    const bytes = all.reduce((acc, a) => acc + (a.sizeBytes || 0), 0);
    // Asignamos 10GB de límite simulado para que la interfaz lo muestre bien
    return { usage: { bytes, maxBytes: 10 * 1024 * 1024 * 1024, maxFiles: 5000 }, assets: all };
  }
};

render();
(async()=>{
  try{
    await idb.init();
    S.db = mockDb; 
    S.assets = mockAssets;
    
    refreshUsage();
    const d = await mockDb.doc("state/settings").get();
    if(d.exists) {
        CFG={...CFG_DEF,...d.data()};
        try{localStorage.setItem("cfg",JSON.stringify(CFG))}catch(e){}
        applyCfg(); render(); renderPlayer();
    }

    let gotS=false,gotP=false;
    setTimeout(()=>{if(!S.restored&&gotS)restoreSession()},1000);

    mockDb.collection("songs").onSnapshot(snap=>{
      S.songs=snap.docs.map(d=>({id:d.id,...d.data()}));
      gotS=true; S.ready=gotS&&gotP;
      if(!snap.metadata||!snap.metadata.fromCache)restoreSession();
      render(); renderPlayer();
    }, ()=>{S.ready=true;render()});

    mockDb.collection("playlists").orderBy("createdAt","asc").onSnapshot(snap=>{
      S.playlists=snap.docs.map(d=>({id:d.id,...d.data()}));
      gotP=true; S.ready=gotS&&gotP;
      render();
    }, ()=>{gotP=true;S.ready=gotS;render()});
  }catch(err){S.ready=true;render()}
})();
})();
</script>
