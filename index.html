<style>
/* ---------- Colores: todos en un solo sitio ----------
   Orden: claro (verde) → otros colores en claro → oscuro (verde) → otros colores en oscuro */
:root{
  --bg:#FFFFFF;--ink:#141A17;--muted:#66706A;--surface:#F2F5F3;--line:#E3E9E5;
  --accent:#2F6B4F;--on-accent:#FFFFFF;--tint:#DCEBE2;--danger:#B3261E;--coral:#E8664F;--coral-tint:#FBE3DD;
  --glass:rgba(255,255,255,.58);--glass-edge:rgba(255,255,255,.75);--glass-hi:rgba(22,20,31,.07);--glass-sh:0 10px 30px rgba(20,18,30,.14),0 1px 3px rgba(20,18,30,.08);
  --mo-animo-bg:#FFE08A;--mo-animo-fg:#C2410C;--mo-bajon-bg:#2B2E5C;--mo-bajon-fg:#B9C2FF;--mo-calma-bg:#D7E8F7;--mo-calma-fg:#2F6FA8;--mo-energia-bg:#FF7A3D;--mo-energia-fg:#FFF4EC;--mo-foco-bg:#DDE6DA;--mo-foco-fg:#3E5B45;--mo-amor-bg:#F9D3DE;--mo-amor-fg:#C2185B;
  color-scheme: light;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
:root[data-accent="azul"]{--accent:#1F4FD8;--tint:#DCE5FF;--on-accent:#FFFFFF;--ink:#141722;--muted:#666B7C;--surface:#F2F4F8;--line:#E3E7EF}
:root[data-accent="petroleo"]{--accent:#0F6E7A;--tint:#D6ECEE;--on-accent:#FFFFFF;--ink:#131B1D;--muted:#64716F;--surface:#F1F5F6;--line:#E1EAEB}
:root[data-accent="mono"]{--accent:#161616;--tint:#E6E6E8;--on-accent:#FFFFFF;--ink:#161616;--muted:#6B6B72;--surface:#F4F4F5;--line:#E6E6E8}
:root[data-accent="morado"]{--accent:#6A3FC2;--tint:#E9E0FA;--on-accent:#FFFFFF;--ink:#18141F;--muted:#6D6878;--surface:#F5F3F8;--line:#E8E4EF}
:root[data-accent="coral"]{--accent:#C4432C;--tint:#FBE3DD;--on-accent:#FFFFFF;--ink:#1C1615;--muted:#75696A;--surface:#F8F4F3;--line:#EEE6E4;--coral:#C4432C}
:root[data-accent="mostaza"]{--accent:#8F6400;--tint:#F6E9C4;--on-accent:#FFFFFF;--ink:#1B1812;--muted:#726B5E;--surface:#F7F5EF;--line:#ECE7DC}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#101312;--ink:#EFF3F0;--muted:#A0ABA4;--surface:#1B201D;--line:#29302C;--accent:#6FBF93;--on-accent:#0E1F16;--tint:#1F3A2C;--danger:#FF8A80;--coral:#FF8C70;--coral-tint:#3A221D;color-scheme:dark;
  --glass:rgba(44,42,52,.55);--glass-edge:rgba(255,255,255,.12);--glass-hi:rgba(255,255,255,.12);--glass-sh:0 10px 30px rgba(0,0,0,.45);
  --mo-animo-bg:#3A2E10;--mo-animo-fg:#FFC94D;--mo-bajon-bg:#1B1D3A;--mo-bajon-fg:#9AA6F2;--mo-calma-bg:#14273A;--mo-calma-fg:#8CC0EC;--mo-energia-bg:#4A1F0E;--mo-energia-fg:#FF9A5C;--mo-foco-bg:#1C2A20;--mo-foco-fg:#A9C9AE;--mo-amor-bg:#3D1626;--mo-amor-fg:#FF8FB3}}
:root[data-theme="dark"]{
  --bg:#101312;--ink:#EFF3F0;--muted:#A0ABA4;--surface:#1B201D;--line:#29302C;--accent:#6FBF93;--on-accent:#0E1F16;--tint:#1F3A2C;--danger:#FF8A80;--coral:#FF8C70;--coral-tint:#3A221D;color-scheme:dark;
  --glass:rgba(44,42,52,.55);--glass-edge:rgba(255,255,255,.12);--glass-hi:rgba(255,255,255,.12);--glass-sh:0 10px 30px rgba(0,0,0,.45);
  --mo-animo-bg:#3A2E10;--mo-animo-fg:#FFC94D;--mo-bajon-bg:#1B1D3A;--mo-bajon-fg:#9AA6F2;--mo-calma-bg:#14273A;--mo-calma-fg:#8CC0EC;--mo-energia-bg:#4A1F0E;--mo-energia-fg:#FF9A5C;--mo-foco-bg:#1C2A20;--mo-foco-fg:#A9C9AE;--mo-amor-bg:#3D1626;--mo-amor-fg:#FF8FB3}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"])[data-accent="azul"]{--accent:#8EA8FF;--tint:#1E2A4A;--on-accent:#0B1430;--bg:#101218;--ink:#EFF1F6;--muted:#A0A6B6;--surface:#1B1E27;--line:#292D39}
  :root:not([data-theme="light"])[data-accent="petroleo"]{--accent:#5FC3CF;--tint:#163A3F;--on-accent:#06242A;--bg:#0F1415;--ink:#EEF4F4;--muted:#9DABAD;--surface:#1A2123;--line:#283033}
  :root:not([data-theme="light"])[data-accent="mono"]{--accent:#F2F2F3;--tint:#2C2C2F;--on-accent:#121212;--bg:#121212;--ink:#F2F2F3;--muted:#A5A5AC;--surface:#1E1E20;--line:#2C2C2F}
  :root:not([data-theme="light"])[data-accent="morado"]{--accent:#B79BFF;--tint:#2A2145;--on-accent:#170E2E;--bg:#131118;--ink:#F2F0F6;--muted:#A8A2B5;--surface:#1F1C26;--line:#2D2936}
  :root:not([data-theme="light"])[data-accent="coral"]{--accent:#FF8C70;--tint:#3A221D;--on-accent:#2A0E07;--bg:#151211;--ink:#F6F1F0;--muted:#B1A6A3;--surface:#221D1C;--line:#322B29;--coral:#FF8C70}
  :root:not([data-theme="light"])[data-accent="mostaza"]{--accent:#E8B931;--tint:#3A2E0E;--on-accent:#261C00;--bg:#14130F;--ink:#F5F2EA;--muted:#ADA796;--surface:#211F19;--line:#312E25}
}
:root[data-theme="dark"][data-accent="azul"]{--accent:#8EA8FF;--tint:#1E2A4A;--on-accent:#0B1430;--bg:#101218;--ink:#EFF1F6;--muted:#A0A6B6;--surface:#1B1E27;--line:#292D39}
:root[data-theme="dark"][data-accent="petroleo"]{--accent:#5FC3CF;--tint:#163A3F;--on-accent:#06242A;--bg:#0F1415;--ink:#EEF4F4;--muted:#9DABAD;--surface:#1A2123;--line:#283033}
:root[data-theme="dark"][data-accent="mono"]{--accent:#F2F2F3;--tint:#2C2C2F;--on-accent:#121212;--bg:#121212;--ink:#F2F2F3;--muted:#A5A5AC;--surface:#1E1E20;--line:#2C2C2F}
:root[data-theme="dark"][data-accent="morado"]{--accent:#B79BFF;--tint:#2A2145;--on-accent:#170E2E;--bg:#131118;--ink:#F2F0F6;--muted:#A8A2B5;--surface:#1F1C26;--line:#2D2936}
:root[data-theme="dark"][data-accent="coral"]{--accent:#FF8C70;--tint:#3A221D;--on-accent:#2A0E07;--bg:#151211;--ink:#F6F1F0;--muted:#B1A6A3;--surface:#221D1C;--line:#322B29;--coral:#FF8C70}
:root[data-theme="dark"][data-accent="mostaza"]{--accent:#E8B931;--tint:#3A2E0E;--on-accent:#261C00;--bg:#14130F;--ink:#F5F2EA;--muted:#ADA796;--surface:#211F19;--line:#312E25}

*,*::before,*::after{box-sizing:border-box}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;height:100%;background:var(--bg);color:var(--ink);font-family:"Figtree",system-ui,-apple-system,sans-serif;font-size:15px;-webkit-tap-highlight-color:transparent}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
button,input{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
h1,h2,h3{font-family:"Bricolage Grotesque",system-ui,sans-serif;margin:0}
.app{position:relative;max-width:560px;margin:0 auto;height:100%;display:flex;flex-direction:column}
main{flex:1;overflow-y:auto;padding:24px 22px 170px;-webkit-overflow-scrolling:touch}
.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:22px;gap:12px}
.top h1{font-size:34px;font-weight:700;letter-spacing:-.8px;line-height:1}
.iconbtn{width:44px;height:44px;border-radius:22px;border:1px solid var(--line);background:var(--bg);display:flex;align-items:center;justify-content:center;flex-shrink:0}
.iconbtn.plain{border:none;background:transparent}
.search{display:flex;align-items:center;gap:10px;background:var(--surface);border-radius:12px;padding:0 14px;height:44px;margin-bottom:28px}
.search input{flex:1;background:transparent;border:none;outline:none;font-size:16px;min-width:0}
.search input::placeholder{color:var(--muted)}
section{margin-bottom:30px}
.sechead{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:12px}
.sechead h2{font-size:19px;font-weight:600}
.link{background:none;border:none;color:var(--muted);font-size:14px;padding:10px 0}
.row{display:flex;align-items:center;gap:14px;width:100%;min-height:58px;padding:6px 0;background:none;border:none;text-align:left}
.row .meta{flex:1;min-width:0;display:flex;flex-direction:column}
.row .t{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .s{font-size:13px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row.playing .t{color:var(--accent)}
.songrow{display:flex;align-items:center;gap:4px}
.songrow .row{flex:1;min-width:0}
.cover{position:relative;overflow:hidden;flex-shrink:0;border-radius:10px}
.cover i{position:absolute;display:block}
.gen .blob{position:absolute;left:16%;top:16%;width:68%;height:68%;background:var(--accent);border-radius:42% 58% 63% 37%/45% 41% 59% 55%;animation:morph 9s ease-in-out infinite alternate;will-change:border-radius,transform}
@keyframes morph{
  0%{border-radius:42% 58% 63% 37%/45% 41% 59% 55%;transform:rotate(0deg) scale(1)}
  25%{border-radius:63% 37% 41% 59%/57% 60% 40% 43%;transform:rotate(40deg) scale(1.05)}
  50%{border-radius:37% 63% 52% 48%/40% 52% 48% 60%;transform:rotate(95deg) scale(.95)}
  75%{border-radius:55% 45% 35% 65%/62% 38% 62% 38%;transform:rotate(140deg) scale(1.03)}
  100%{border-radius:46% 54% 58% 42%/38% 57% 43% 62%;transform:rotate(180deg) scale(1)}
}
.player .big .blob{animation-duration:6s}
.player.paused .blob{animation-play-state:paused}
@media (prefers-reduced-motion: reduce){.gen .blob{animation:none}}
.recent{display:flex;gap:14px;overflow-x:auto;padding-bottom:4px;margin:0 -22px;padding-left:22px;padding-right:22px;scrollbar-width:none}
.recent::-webkit-scrollbar{display:none}
.card{width:132px;flex-shrink:0;background:none;border:none;padding:0;text-align:left;display:flex;flex-direction:column;gap:10px}
.card .t{font-weight:600;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card .s{font-size:13px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.empty{border:1px dashed var(--line);border-radius:16px;padding:28px 20px;text-align:center;color:var(--muted)}
.empty h3{color:var(--ink);font-size:18px;margin-bottom:6px}
.btn{height:46px;padding:0 20px;border-radius:23px;border:none;background:var(--accent);color:var(--on-accent);font-weight:600}
.btn.ghost{background:var(--surface);color:var(--ink)}
.btn.danger{background:transparent;color:var(--danger);border:1px solid var(--line)}
/* Barra inferior estilo cristal (Liquid Glass) */
.glass{background:var(--glass);-webkit-backdrop-filter:blur(24px) saturate(180%);backdrop-filter:blur(24px) saturate(180%);border:1px solid var(--glass-edge);box-shadow:var(--glass-sh)}
.dock{position:absolute;left:0;right:0;bottom:0;z-index:20;display:flex;flex-wrap:wrap;align-items:center;gap:8px 10px;padding:0 12px 6px;pointer-events:none}
.dock>*{pointer-events:auto}
#miniSlot{order:0;flex:1 0 100%;min-width:0}
#miniSlot:empty{display:none}
.mini{position:relative;display:flex;align-items:center;gap:10px;height:56px;padding:0 4px 0 8px;border-radius:28px;overflow:hidden}
.mini .open{flex:1;min-width:0;display:flex;align-items:center;gap:10px;background:none;border:none;text-align:left;padding:0;height:100%}
.mini .iconbtn{border:none;background:transparent;width:42px;height:42px}
.mini .bar{position:absolute;left:22px;right:22px;bottom:0;height:2px;background:transparent;border-radius:1px;overflow:hidden}
nav.tabs{order:1;flex:1;min-width:0;display:flex;justify-content:space-between;height:62px;padding:4px;border-radius:31px;position:relative;touch-action:none;-webkit-user-select:none;user-select:none}
nav.tabs button{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;min-width:0;padding:0;border:none;border-radius:27px;background:transparent;color:var(--ink);font-size:11px;font-weight:500;transition:background .25s,color .25s}
nav.tabs button[aria-current="page"]{color:var(--accent);font-weight:600}
nav.tabs button{position:relative;z-index:1;-webkit-touch-callout:none}
.tabpill{position:absolute;left:0;top:4px;bottom:4px;width:0;border-radius:27px;background:var(--glass-hi);opacity:0;pointer-events:none;z-index:0;transition:transform .42s cubic-bezier(.3,1.35,.5,1),width .3s ease,opacity .2s ease,background .2s ease,box-shadow .2s ease}
nav.tabs.dragging .tabpill{z-index:2;overflow:hidden;background:var(--bg);box-shadow:0 8px 24px rgba(20,18,30,.20),0 1px 3px rgba(20,18,30,.12),inset 0 0 0 1px var(--line)}
.tabpill .lens{position:absolute;top:-4px;height:62px;display:flex;justify-content:space-between;padding:4px;opacity:0;transition:opacity .15s ease}
nav.tabs.dragging .tabpill .lens{opacity:1}
.tabpill .lens span{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;min-width:0;color:var(--ink);font-size:11px;font-weight:500}
.tabpill .lens span.on{color:var(--accent);font-weight:600}
.tabpill::after{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;opacity:0;transition:opacity .15s ease;background:radial-gradient(120% 90% at 50% 0%,rgba(255,255,255,.55),rgba(255,255,255,0) 55%),radial-gradient(120% 90% at 50% 100%,rgba(20,18,30,.10),rgba(20,18,30,0) 60%);box-shadow:inset 0 1px 1px rgba(255,255,255,.7),inset 0 -1px 2px rgba(20,18,30,.10)}
nav.tabs.dragging .tabpill::after{opacity:1}
:root[data-theme="dark"] .tabpill::after{background:radial-gradient(120% 90% at 50% 0%,rgba(255,255,255,.14),rgba(255,255,255,0) 55%);box-shadow:inset 0 1px 1px rgba(255,255,255,.18)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .tabpill::after{background:radial-gradient(120% 90% at 50% 0%,rgba(255,255,255,.14),rgba(255,255,255,0) 55%);box-shadow:inset 0 1px 1px rgba(255,255,255,.18)}}
nav.tabs.dragging button[aria-current="page"]:not(.hover){color:var(--ink);font-weight:500}
nav.tabs button.hover{color:var(--accent)}
@media (prefers-reduced-motion: reduce){.tabpill{transition:opacity .2s ease}}
.dock .round{order:2;width:62px;height:62px;flex:0 0 auto;border-radius:31px;display:flex;align-items:center;justify-content:center;color:var(--ink);padding:0}
/* Compacta: pestaña activa · mini reproductor · buscar */
.dock.compact{flex-wrap:nowrap}
.dock.compact nav.tabs{order:0;flex:0 0 52px;height:52px;padding:0;border-radius:26px}
.dock.compact nav.tabs button:not([aria-current="page"]){display:none}
.dock.compact nav.tabs button{font-size:0;gap:0;background:transparent}
.dock.compact #miniSlot{order:1;flex:1 1 auto}
.dock.compact .mini{height:52px;gap:8px}
.dock.compact .mini .cover{width:36px!important;height:36px!important}
.dock.compact #miniNext{display:none}
.dock.compact .round{width:52px;height:52px;margin-left:auto}
@supports not ((backdrop-filter:blur(1px)) or (-webkit-backdrop-filter:blur(1px))){.glass{background:var(--surface)}}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(150px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:12px 18px;border-radius:14px;font-size:14px;max-width:calc(100% - 40px);z-index:50;box-shadow:0 6px 24px rgba(0,0,0,.18)}
.sheet-wrap{position:fixed;inset:0;z-index:40;background:rgba(10,10,14,.35);display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--bg);width:100%;max-width:560px;border-radius:24px 24px 0 0;padding:20px 22px calc(24px + env(safe-area-inset-bottom,0px));max-height:85%;overflow-y:auto}
.pickrow.up{flex-direction:column;align-items:flex-start;justify-content:center;gap:0;padding:8px 0}
.pickhint{display:block;margin-top:2px;font-size:13px;font-weight:400;color:var(--muted);line-height:1.35}
.sheet h3{font-size:20px;margin-bottom:14px}
.field{display:flex;flex-direction:column;gap:6px;margin-bottom:14px}
.field label{font-size:13px;color:var(--muted)}
.field input{height:46px;border-radius:12px;border:1px solid var(--line);background:var(--bg);padding:0 14px;font-size:16px}
.actions{display:flex;gap:10px;justify-content:flex-end;margin-top:6px;flex-wrap:wrap}
.player{position:fixed;inset:0;z-index:30;background:var(--bg);display:flex;justify-content:center;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
.player .in{width:100%;max-width:440px;display:flex;flex-direction:column;gap:26px;padding:12px 26px 28px;overflow-y:auto}
.player .head{display:flex;justify-content:space-between;align-items:center}
.player .src{font-size:13px;color:var(--muted)}
.player .big{width:100%;aspect-ratio:1/1;border-radius:24px}
.titleline{display:flex;justify-content:space-between;align-items:center;gap:10px}
.titleline h2{font-size:26px;font-weight:700;letter-spacing:-.4px;line-height:1.1;overflow-wrap:anywhere}
.titleline .a{color:var(--muted);margin-top:4px}
input[type=range]{width:100%;-webkit-appearance:none;appearance:none;height:24px;background:transparent;margin:0}
input[type=range]::-webkit-slider-runnable-track{height:4px;border-radius:2px;background:linear-gradient(var(--ink),var(--ink)) 0/var(--p,0%) 100% no-repeat,var(--line)}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:14px;height:14px;border-radius:7px;background:var(--ink);margin-top:-5px}
input[type=range]::-moz-range-track{height:4px;border-radius:2px;background:var(--line)}
input[type=range]::-moz-range-progress{height:4px;background:var(--ink)}
input[type=range]::-moz-range-thumb{width:14px;height:14px;border:none;border-radius:7px;background:var(--ink)}
.times{display:flex;justify-content:space-between;font-size:12px;color:var(--muted);margin-top:2px}
.controls{display:flex;justify-content:space-between;align-items:center}
.ctrl{width:52px;height:52px;border:none;background:none;display:flex;align-items:center;justify-content:center;color:var(--ink)}
.ctrl.small{width:44px;height:44px;color:var(--muted)}
.ctrl.small.on{color:var(--accent)}
.play{width:72px;height:72px;border-radius:36px;border:none;background:var(--accent);color:var(--on-accent);display:flex;align-items:center;justify-content:center}
.next{display:flex;align-items:center;gap:12px;border-top:1px solid var(--line);padding-top:18px}
.progress{height:3px;background:var(--line);border-radius:2px;overflow:hidden;margin-top:10px}
.progress div{height:100%;background:var(--accent);width:0}
.pickrow{display:flex;align-items:center;gap:12px;min-height:52px;width:100%;background:none;border:none;text-align:left;padding:4px 0}
.check{width:22px;height:22px;border-radius:6px;border:1.5px solid var(--line);display:flex;align-items:center;justify-content:center;flex-shrink:0}
.check.on{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.backline{display:flex;align-items:center;gap:6px;margin-bottom:16px}
.status{font-size:13px;color:var(--muted);margin-top:-18px;margin-bottom:22px}
.seg{display:flex;background:var(--surface);border-radius:12px;padding:3px;margin:-12px 0 22px}

<script>
/* ---------- Toques: un solo vigilante para toda la app ----------
   Cada parte de la app apunta aquí lo que hace con sus botones (onTap). Los de prioridad (cap)
   miran el toque primero; en cuanto uno lo atiende (stopPropagation), nadie más lo procesa. */
const TAPS={cap:[],bub:[]};
function onTap(fn,cap){(cap?TAPS.cap:TAPS.bub).push(fn)}
function runTaps(list,e){for(const fn of list){if(e.cancelBubble)break;try{const r=fn(e);if(r&&r.catch)r.catch(err=>console.error(err))}catch(err){console.error(err)}}}
document.addEventListener("click",e=>runTaps(TAPS.cap,e),true);
document.addEventListener("click",e=>runTaps(TAPS.bub,e));

/* ---------- Guardado en el dispositivo (IndexedDB) ---------- */
const APP_VER=(document.querySelector('meta[name="app-version"]')||{}).content||"";
const UPD={checking:false,last:0,offered:""};

/* ---------- Almacenamiento local (IndexedDB) ---------- */
const BU=new Map();
function bu(id){if(!id)return "";const u=BU.get(id);if(u)return u;loadUrl(id);return ""}
const idb={
  db:null,
  init(){return new Promise((res,rej)=>{
    const req=indexedDB.open("MiMusicaDB",2);
    req.onupgradeneeded=e=>{const db=e.target.result;for(const st of ["songs","playlists","assets","state","plays"])if(!db.objectStoreNames.contains(st))db.createObjectStore(st,{keyPath:"id"})};
    req.onsuccess=e=>{this.db=e.target.result;res()};
    req.onerror=()=>rej(req.error);
    req.onblocked=()=>rej(new Error("blocked"));
  })},
  get(st,id){return new Promise((res,rej)=>{const r=this.db.transaction(st).objectStore(st).get(id);r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)})},
  getAll(st){return new Promise((res,rej)=>{const r=this.db.transaction(st).objectStore(st).getAll();r.onsuccess=()=>res(r.result||[]);r.onerror=()=>rej(r.error)})},
  put(st,data){return new Promise((res,rej)=>{const tx=this.db.transaction(st,"readwrite");tx.objectStore(st).put(data);tx.oncomplete=()=>res();tx.onerror=()=>rej(tx.error);tx.onabort=()=>rej(tx.error)})},
  del(st,id){return new Promise((res,rej)=>{const tx=this.db.transaction(st,"readwrite");tx.objectStore(st).delete(id);tx.oncomplete=()=>res();tx.onerror=()=>rej(tx.error)})}
};
async function loadUrl(id){
  if(!id||BU.has(id)||!idb.db)return BU.get(id)||"";
  try{const a=await idb.get("assets",id);if(a&&a.data&&!BU.has(id))BU.set(id,URL.createObjectURL(a.data))}catch(e){}
  return BU.get(id)||"";
}
async function blobFetch(id){
  try{const a=await idb.get("assets",id);if(a&&a.data)return new Response(a.data)}catch(e){}
  return {ok:false,status:404,arrayBuffer:async()=>new ArrayBuffer(0)};
}
const clean=o=>{if(!o)return o;const {id,coverBlobUrl,...r}=o;return r};
const newId=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,10);
const LISTEN={};
async function notify(col){
  const L=LISTEN[col];if(!L||!L.length)return;
  let all=await idb.getAll(col);
  if(col==="songs")await Promise.all(all.flatMap(s=>[loadUrl(s.assetId),loadUrl(s.coverId)]));
  for(const l of L){
    let rows=all;
    if(l.ord){const [f,dir]=l.ord;rows=[...rows].sort((a,b)=>((a[f]??0)>(b[f]??0)?1:(a[f]??0)<(b[f]??0)?-1:0)*(dir==="desc"?-1:1))}
    try{l.cb({docs:rows.map(r=>({id:r.id,exists:true,data:()=>clean(r)})),metadata:{fromCache:false}})}catch(e){console.error(e)}
  }
}
function query(col,conds=[],ord=null,lim=0){
  const match=r=>conds.every(([f,op,v])=>op==="=="?r[f]===v:op==="in"?v.includes(r[f]):op===">="?r[f]>=v:op==="<="?r[f]<=v:op===">"?r[f]>v:op==="<"?r[f]<v:true);
  return{
    where:(f,op,v)=>query(col,[...conds,[f,op,v]],ord,lim),
    orderBy:(f,dir)=>query(col,conds,[f,dir||"asc"],lim),
    limit:n=>query(col,conds,ord,n),
    async get(){let rows=(await idb.getAll(col)).filter(match);if(ord){const [f,dir]=ord;rows.sort((a,b)=>((a[f]??0)>(b[f]??0)?1:-1)*(dir==="desc"?-1:1))}if(lim)rows=rows.slice(0,lim);const docs=rows.map(r=>({id:r.id,exists:true,data:()=>clean(r)}));return{docs,empty:!docs.length,size:docs.length}},
    onSnapshot(cb,err){(LISTEN[col]=LISTEN[col]||[]).push({cb,ord});notify(col).catch(e=>err&&err(e));return()=>{LISTEN[col]=LISTEN[col].filter(l=>l.cb!==cb)}},
    async add(data){const id=newId();await idb.put(col,{...clean(data),id});notify(col);return{id}},
    doc(id){return{
      id,
      async get(){const d=await idb.get(col,id);return{id,exists:!!d,data:()=>clean(d)}},
      async set(data){await idb.put(col,{...clean(data),id});notify(col)},
      async update(data){const o=await idb.get(col,id);if(!o)throw new Error("not-found");await idb.put(col,{...o,...clean(data),id});notify(col)},
      async delete(){await idb.del(col,id);notify(col)}
    }}
  };
}
const localDb={collection:c=>query(c),doc:p=>{const [c,id]=p.split("/");return query(c).doc(id)}};
const localAssets={
  async upload(file,opts){
    const type=(opts&&opts.type)||file.type||"application/octet-stream";
    const data=file.type===type?file:new Blob([file],{type});
    const id=newId();
    try{await idb.put("assets",{id,data,sizeBytes:file.size,contentType:type,createdAt:Date.now()})}
    catch(e){throw {code:e&&e.name==="QuotaExceededError"?"quota_exceeded":"upload_failed"}}
    return{id,sizeBytes:file.size,contentType:type};
  },
  async delete(id){await idb.del("assets",id);const u=BU.get(id);if(u){URL.revokeObjectURL(u);BU.delete(id)}},
  async list(){
    const all=await idb.getAll("assets");
    let bytes=all.reduce((n,a)=>n+(a.sizeBytes||0),0),maxBytes=10*1073741824;
    try{if(navigator.storage&&navigator.storage.estimate){const e=await navigator.storage.estimate();if(e.quota)maxBytes=e.quota;if(e.usage&&e.usage>bytes)bytes=e.usage}}catch(e){}
    return{usage:{bytes,maxBytes,maxFiles:100000},assets:all.map(a=>({id:a.id,sizeBytes:a.sizeBytes,contentType:a.contentType}))};
  }
};

(function(){
"use strict";
const $=s=>document.querySelector(s);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const mb=b=>b>=1073741824?(b/1073741824).toFixed(1).replace(".",",")+" GB":Math.round(b/1048576)+" MB";
async function refreshUsage(){try{if(S.assets){const r=await S.assets.list();S.usage=r.usage;render()}}catch(e){}}

/* ---------- Repintado sin parpadeos ---------- */
/* Al cambiar de canción se vuelve a pintar la pantalla. Las portadas que ya estaban
   cargadas se reutilizan tal cual, así no se quedan en blanco un instante. */
const SEEN=new Set();
document.addEventListener("load",e=>{const t=e.target;if(t&&t.tagName==="IMG"){const m=/\/_blob\/([^?#]+)/.exec(t.getAttribute("src")||"");if(m)SEEN.add(m[1])}},true);
/* ---------- Redibujar solo lo que cambia ----------
   En vez de borrar la página y escribirla entera, se compara con lo nuevo y solo se tocan
   los textos, atributos y elementos que han cambiado. Así no parpadean las portadas, no se
   reinician las animaciones y el scroll y el foco se quedan donde estaban. */
const MKEY=n=>n.nodeType===1?(n.id||n.getAttribute("data-k")||""):"";
function morphAttrs(a,b){
  for(const at of [...a.attributes])if(!b.hasAttribute(at.name))a.removeAttribute(at.name);
  for(const at of [...b.attributes])if(a.getAttribute(at.name)!==at.value)a.setAttribute(at.name,at.value);
  if(a.tagName==="INPUT"||a.tagName==="TEXTAREA"||a.tagName==="SELECT"){
    if(document.activeElement!==a){const v=b.tagName==="TEXTAREA"?b.textContent:b.getAttribute("value");if(v!=null&&a.value!==v)a.value=v;else if(v==null&&a.tagName==="INPUT"&&a.type!=="checkbox"&&a.type!=="radio"&&a.value!=="")a.value=""}
    if(a.type==="checkbox"||a.type==="radio")a.checked=b.hasAttribute("checked");
  }
}
function morphKids(from,to){
  let a=from.firstChild,b=to.firstChild;
  while(b){
    const nb=b.nextSibling;
    if(!a){from.appendChild(b);b=nb;continue}
    if(a.nodeType===b.nodeType&&a.nodeName===b.nodeName&&MKEY(a)===MKEY(b)){morphNode(a,b);a=a.nextSibling;b=nb;continue}
    const k=MKEY(b);let m=null;
    if(k){for(let x=a.nextSibling;x;x=x.nextSibling)if(x.nodeName===b.nodeName&&MKEY(x)===k){m=x;break}}
    if(m){from.insertBefore(m,a);morphNode(m,b)}else from.insertBefore(b,a);
    b=nb;
  }
  while(a){const n=a.nextSibling;from.removeChild(a);a=n}
}
function morphNode(a,b){
  if(a.nodeType===3||a.nodeType===8){if(a.data!==b.data)a.data=b.data;return}
  if(a.nodeType!==1)return;
  morphAttrs(a,b);
  if(a.tagName==="TEXTAREA")return;
  if(a.isEqualNode&&a.isEqualNode(b))return;
  morphKids(a,b);
}
function morphHTML(el,html){const t=document.createElement("template");t.innerHTML=html;morphKids(el,t.content)}
function setHTML(el,html){
  if(el.id==="main"){morphHTML(el,html);return}
  const old=new Map();
  el.querySelectorAll("img[src]").forEach(i=>{if(i.complete&&i.naturalWidth){const k=i.getAttribute("src");if(!old.has(k))old.set(k,[]);old.get(k).push(i)}});
  el.innerHTML=html;
  if(!old.size)return;
  el.querySelectorAll("img[src]").forEach(n=>{const a=old.get(n.getAttribute("src"));if(a&&a.length){const o=a.pop();o.style.cssText=n.style.cssText;o.className=n.className;n.replaceWith(o)}});
}

/* ---------- Colores de la portada (para el fondo del reproductor) ---------- */
const PAL=new Map(); const palWait=new Map();
try{const o=JSON.parse(localStorage.getItem("pal")||"{}");for(const k in o)PAL.set(k,o[k])}catch(e){}
function savePal(){try{const o={};[...PAL.entries()].slice(-400).forEach(([k,v])=>o[k]=v);localStorage.setItem("pal",JSON.stringify(o))}catch(e){}}
function rgb2hsl(r,g,b){r/=255;g/=255;b/=255;const mx=Math.max(r,g,b),mn=Math.min(r,g,b),l=(mx+mn)/2;let h=0,s=0;if(mx!==mn){const d=mx-mn;s=l>.5?d/(2-mx-mn):d/(mx+mn);h=mx===r?(g-b)/d+(g<b?6:0):mx===g?(b-r)/d+2:(r-g)/d+4;h*=60}return [h,s,l]}
const hsl=(h,s,l)=>`hsl(${Math.round(h)} ${Math.round(s*100)}% ${Math.round(l*100)}%)`;
function genPal(id){const h=hash(id||"x")%360;return {f1:hsl(h,.62,.42),f2:hsl((h+48)%360,.58,.36),f3:hsl((h+20)%360,.42,.15),avg:hsl(h,.4,.5),v:[hsl(h,.75,.58),hsl((h+48)%360,.7,.55)]}}
function palOf(s){if(!s)return null;if(!s.coverId)return genPal(s.id);return PAL.get(s.coverId)||null}
function getPal(s){
  if(!s)return Promise.resolve(null);
  const now=palOf(s); if(now)return Promise.resolve(now);
  if(palWait.has(s.coverId))return palWait.get(s.coverId);
  const pr=new Promise(res=>{
    const img=new Image();
    img.onload=()=>{
      try{
        const c=document.createElement("canvas");c.width=c.height=36;const x=c.getContext("2d",{willReadFrequently:true});x.drawImage(img,0,0,36,36);
        const d=x.getImageData(0,0,36,36).data, B=new Map(); let ar=0,ag=0,ab=0,n=0;
        for(let i=0;i<d.length;i+=4){const r=d[i],g=d[i+1],b=d[i+2];ar+=r;ag+=g;ab+=b;n++;const [hh,ss,ll]=rgb2hsl(r,g,b);const k=(r>>5)+"_"+(g>>5)+"_"+(b>>5);const w=.25+ss*(1-Math.abs(ll-.5)*1.4);const o=B.get(k)||{r:0,g:0,b:0,w:0};o.r+=r*w;o.g+=g*w;o.b+=b*w;o.w+=w;B.set(k,o)}
        const L=[...B.values()].filter(o=>o.w>0).map(o=>({r:o.r/o.w,g:o.g/o.w,b:o.b/o.w,w:o.w})).sort((a,b)=>b.w-a.w);
        const pick=[];for(const c2 of L){if(pick.every(q=>Math.hypot(q.r-c2.r,q.g-c2.g,q.b-c2.b)>70))pick.push(c2);if(pick.length===3)break}
        while(pick.length<3)pick.push(pick[0]||{r:ar/n,g:ag/n,b:ab/n});
        const hs=pick.map(q=>rgb2hsl(q.r,q.g,q.b));
        const dk=([h,s2,l],lo,hi,sm)=>hsl(h,Math.min(1,s2*sm),Math.max(lo,Math.min(hi,l)));
        const v={f1:dk(hs[0],.2,.46,1.15),f2:dk(hs[1],.18,.42,1.15),f3:dk(hs[0],.08,.17,.9),avg:`rgb(${Math.round(ar/n)} ${Math.round(ag/n)} ${Math.round(ab/n)})`,v:[dk(hs[0],.45,.62,1.3),dk(hs[1],.4,.6,1.3)]};
        PAL.set(s.coverId,v); savePal(); res(v);
      }catch(e){res(genPal(s.id))}
      palWait.delete(s.coverId);
    };
    img.onerror=()=>{palWait.delete(s.coverId);res(genPal(s.id))};
    img.src=bu(s.coverId);
  });
  palWait.set(s.coverId,pr); return pr;
}
function applyFlow(){
  const p=document.querySelector(".player.flow"), s=current(); if(!p||!s)return;
  const set=v=>{if(!v)return;p.style.setProperty("--f1",v.f1);p.style.setProperty("--f2",v.f2);p.style.setProperty("--f3",v.f3)};
  const now=palOf(s); if(now){set(now);return}
  getPal(s).then(v=>{if(current()&&current().id===s.id)set(v)});
}

function hash(s){let h=2166136261;for(const c of String(s)){h^=c.charCodeAt(0);h=Math.imul(h,16777619)}return h>>>0}
const GEN_HUES=[150,205,262,330,12,32,186,95,228,350];
function art(song,size,radius){
  const r=radius??Math.max(8,Math.round(size*0.12));
  if(song&&song.coverId){const pc=PAL.get(song.coverId);return `<span class="cover" aria-hidden="true" style="width:${size}px;height:${size}px;border-radius:${r}px;background:${pc?pc.avg:"var(--surface)"};display:block"><img src="${bu(song.coverId)}" alt="" ${SEEN.has(song.coverId)?"":'loading="lazy"'} style="width:100%;height:100%;object-fit:cover;display:block"></span>`}
  const ic=Math.round(size*0.3), delay=-(hash(song?song.id:"x")%9000)/1000, gh=GEN_HUES[hash(song?(song.album||song.title||song.id):"x")%GEN_HUES.length];
  return `<span class="cover gen hue" aria-hidden="true" style="--h:${gh};width:${size}px;height:${size}px;border-radius:${r}px;display:flex;align-items:center;justify-content:center"><span class="blob" style="animation-delay:${delay}s"></span><svg width="${ic}" height="${ic}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true" style="position:relative;color:var(--on-accent)"><path d="M9 18V5l11-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="17" cy="16" r="3"/></svg></span>`;
}
function listArt(p,size,radius){
  const first=(p.songIds||[]).map(byId).find(x=>x&&x.coverId);
  return first?art(first,size,radius):cover("lista"+p.id,size,radius);
}
const sub=s=>{const a=albumLabel(s);return esc(s.artist||"Artista desconocido")+(a?" · "+esc(a):"")};
function cover(seed,size,radius){
  const h=hash(seed), v=h%5, tone=Math.floor(h/5)%3;
  const bgs=["var(--accent)","var(--tint)","var(--ink)"], bg=bgs[tone];
  const fg=tone===1?"var(--accent)":"var(--bg)";
  const r=radius??Math.max(8,Math.round(size*0.12));
  const u=size/132; let inner="";
  if(v===0) inner=`<i style="width:${56*u}px;height:${56*u}px;border-radius:50%;background:${fg};left:${38*u}px;top:${38*u}px"></i>`;
  else if(v===1) inner=`<i style="width:100%;height:50%;left:0;top:50%;background:${fg}"></i>`;
  else if(v===2) inner=`<i style="width:${64*u}px;height:${64*u}px;border-radius:50%;border:${Math.max(1.5,2*u)}px solid ${fg};left:${32*u}px;top:${32*u}px"></i>`;
  else if(v===3) inner=`<i style="width:${110*u}px;height:${110*u}px;border-radius:50%;background:${fg};right:${-30*u}px;bottom:${-30*u}px"></i>`;
  else inner=`<i style="width:50%;height:100%;left:50%;top:0;background:${fg};border-radius:${size}px 0 0 ${size}px"></i>`;
  return `<span class="cover" aria-hidden="true" style="width:${size}px;height:${size}px;border-radius:${r}px;background:${bg};display:block">${inner}</span>`;
}

  try{const ny=new Date().getFullYear();let all=[];for(let y=FIRST_YEAR;y<=ny;y++)all=all.concat(await fetchYear(y));AUTO.list=all}
  catch(e){if(!AUTO.list)AUTO.list=[]}

function playStats(){
  if(AUTO.memo&&AUTO.memo.songs===S.songs)return AUTO.memo.m;
  const cf=canonFn(), m=new Map();
  for(const e of AUTO.list||[]){const id=cf(e);const o=m.get(id)||{n:0,last:0};o.n++;if(e.t>o.last)o.last=e.t;m.set(id,o)}

function autoSongs(k){
  if(k==="fav")return S.songs.filter(x=>x.fav).sort((a,b)=>a.title.localeCompare(b.title,"es"));
  if(k==="new"){const from=Date.now()-30*864e5;return S.songs.filter(x=>(x.createdAt||0)>=from).sort((a,b)=>(b.createdAt||0)-(a.createdAt||0)).slice(0,60)}
  const st=playStats(), L=[...st.entries()].map(([id,o])=>({s:byId(id),...o})).filter(x=>x.s);
  if(k==="top")return L.filter(x=>x.n>=2).sort((a,b)=>b.n-a.n||b.last-a.last).slice(0,50).map(x=>x.s);
  if(k==="old"){const lim=Date.now()-30*864e5;return L.filter(x=>x.n>=3&&x.last<lim).sort((a,b)=>b.n-a.n).slice(0,50).map(x=>x.s)}

function autoArt(k,size,r){

const norm=x=>String(x||"").toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"").replace(/\s+/g," ").trim();
const artistOf=s=>s.artist||"Artista desconocido";
function splitArtists(str){
  const re=CFG.splitAmp?/\s*(?:,|;|\/|\s&\s|\s(?:feat\.?|ft\.?|featuring|with|con|x|vs\.?)\s)\s*/i:/\s*(?:,|;|\/|\s(?:feat\.?|ft\.?|featuring|with|con|x|vs\.?)\s)\s*/i;
  const parts=String(str||"").split(re).map(x=>x.replace(/^[(\[]|[)\]]$/g,"").trim()).filter(Boolean);
  return parts.length?parts:["Artista desconocido"];
}
function groups(kind){
  const m=new Map();
  for(const x of S.songs){
    const names=kind==="artist"?splitArtists(x.artist):(x.album?[x.album]:[]);
    for(const name of names){
      const k=norm(name); if(!m.has(k))m.set(k,{kind,name,songs:[]});
      const g=m.get(k); if(!g.songs.includes(x))g.songs.push(x);
    }
  }
  const q=norm(S.q);
  return [...m.values()].filter(g=>!q||norm(g.name+" "+g.songs.map(artistOf).join(" ")).includes(q)).sort((a,b)=>a.name.localeCompare(b.name,"es"));
}
function groupSongs(g){
  const k=norm(g.name);
  return S.songs.filter(x=>g.kind==="artist"?splitArtists(x.artist).some(a=>norm(a)===k):norm(x.album)===k)
    .sort((a,b)=>g.kind==="artist"?((a.album||"~").localeCompare(b.album||"~","es")||a.title.localeCompare(b.title,"es")):((a.createdAt||0)-(b.createdAt||0)));
}
function mainArtist(list){const c={};for(const x of list){const a=artistOf(x);c[a]=(c[a]||0)+1}return Object.entries(c).sort((a,b)=>b[1]-a[1])[0]?.[0]||""}

/* ---------- Canciones repetidas ---------- */
/* Misma canción = mismo título y artista, y además no tienen álbumes distintos ni una
   duración que se diferencie en más de 3 segundos. */
const dupKey=x=>norm(x.title)+"|"+norm(x.artist);
function sameSong(a,b){
  if(a.album&&b.album&&norm(a.album)!==norm(b.album))return false;
  if(a.duration&&b.duration&&Math.abs(a.duration-b.duration)>3)return false;
  return true;
}
const inLists=id=>S.playlists.filter(p=>(p.songIds||[]).includes(id)).length;
const dupScore=x=>(x.coverId?8:0)+(x.album?4:0)+(x.lyrics?2:0)+(x.fav?2:0)+(x.moodBy==="tú"?1:0)+inLists(x.id);
let DUPC={songs:null,lists:null,groups:[]};
function dupGroups(){
  if(DUPC.songs===S.songs&&DUPC.lists===S.playlists)return DUPC.groups;
  const by=new Map();
  for(const x of S.songs){if(!norm(x.title))continue;const k=dupKey(x);if(!by.has(k))by.set(k,[]);by.get(k).push(x)}
  const out=[];
  for(const list of by.values()){
    if(list.length<2)continue;
    const left=[...list];
    while(left.length){
      const g=[left.shift()];
      for(let i=left.length-1;i>=0;i--)if(g.every(y=>sameSong(y,left[i])))g.push(left.splice(i,1)[0]);
      if(g.length>1)out.push(g.sort((a,b)=>dupScore(b)-dupScore(a)||(a.createdAt||0)-(b.createdAt||0)));
    }
  }
  DUPC={songs:S.songs,lists:S.playlists,groups:out};
  return out;
}
const dupGk=g=>g.map(x=>x.id).sort().join(",");
function dupPlan(){return dupGroups().map(g=>{const k=S.dupPick&&S.dupPick.get(dupGk(g));const keep=g.find(x=>x.id===k)||g[0];return {keep,rm:g.filter(x=>x!==keep)}})}
function dupSummary(){if(!S.ready)return "Buscando…";const n=dupGroups().reduce((a,g)=>a+g.length-1,0);return n?(n===1?"Hay 1 copia repetida":"Hay "+n+" copias repetidas"):"No tienes canciones repetidas"}
/* Para el Wrapped y «En bucle»: cada escucha cuenta para la versión que se queda,
   también las de copias que ya borraste antes. */
function canonFn(){
  const m=new Map(), byKey=new Map();
  for(const g of dupGroups())for(const x of g.slice(1))m.set(x.id,g[0].id);
  for(const x of S.songs){const k=dupKey(x);if(!byKey.has(k))byKey.set(k,m.get(x.id)||x.id)}
  return e=>{if(byId(e.s))return m.get(e.s)||e.s;const k=norm(e.ti)+"|"+norm(e.ar);if(!byKey.has(k))byKey.set(k,e.s);return byKey.get(k)};
}
function renderDups(){

async function mergeDups(plan){
  if(!plan.length)return;
  const to=new Map(); for(const {keep,rm} of plan)for(const x of rm)to.set(x.id,keep.id);
  let errors=0;
  S.uploading={done:0,total:plan.length,name:"Uniendo repetidas…"};
  // Listas: la copia se cambia por la versión que se queda, sin repetirla
  for(const p of S.playlists){
    const ids=p.songIds||[]; if(!ids.some(id=>to.has(id)))continue;
    const out=[]; for(const id of ids){const k=to.get(id)||id;if(!out.includes(k))out.push(k)}
    try{await S.db.collection("playlists").doc(p.id).update({songIds:out});p.songIds=out}catch(e){errors++}
  }
  // Lo que tenga la copia y le falte a la que se queda
  for(const {keep,rm} of plan){
    const up={};
    if(!keep.fav&&rm.some(x=>x.fav))up.fav=true;
    if(!keep.lyrics){const l=rm.find(x=>x.lyrics);if(l)up.lyrics=l.lyrics}
    if(keep.moodBy!=="tú"){const mo=rm.find(x=>x.moodBy==="tú"&&Array.isArray(x.moods));if(mo){up.moods=mo.moods;up.moodBy="tú"}}
    if(Object.keys(up).length){try{await S.db.collection("songs").doc(keep.id).update(up)}catch(e){errors++}}
  }
  // Cola y recientes apuntan a la versión que se queda
  const cur=current();
  if(!(cur&&to.has(cur.id))){
    const curId=S.queue[S.qi]; const q=[]; for(const id of S.queue){const k=to.get(id)||id;if(k===curId||!q.includes(k))q.push(k)}
    S.queue=q; S.qi=q.indexOf(curId);
  }
  S.recent=[...new Set(S.recent.map(id=>to.get(id)||id))];
  try{localStorage.setItem("recent",JSON.stringify(S.recent))}catch(e){}
  S.dupPick=new Map();
  await deleteSongs([...to.keys()]);
  if(errors)toast("Algunas listas no se han podido actualizar. Revisa tus listas.",6000);
}

  const fromEl=p&&p.querySelector(toLyrics?".big .cover":".lyrart .cover");
  if(reduce||!p||!fromEl||!p.animate){S.showLyrics=toLyrics;renderPlayer();return}
  const P=p.getBoundingClientRect(), A=fromEl.getBoundingClientRect(), aR=parseFloat(getComputedStyle(fromEl).borderRadius)||10;
  const keep=["#seek",".controls",".extras",".next"], before={};
  keep.forEach(k=>{const e=p.querySelector(k);if(e)before[k]=(k==="#seek"?e.parentElement:e).getBoundingClientRect().top});
  // Copia de lo que desaparece, para desvanecerla encima

  let ghost=null;
  if(gone){const r=gone.getBoundingClientRect(),st=gone.scrollTop;ghost=gone.cloneNode(true);ghost.removeAttribute("id");ghost.querySelectorAll("[id]").forEach(x=>x.removeAttribute("id"));Object.assign(ghost.style,{position:"absolute",left:(r.left-P.left)+"px",top:(r.top-P.top)+"px",width:r.width+"px",height:r.height+"px",margin:"0",zIndex:"2",pointerEvents:"none",paddingTop:gone.style.paddingTop,paddingBottom:gone.style.paddingBottom});p.appendChild(ghost);ghost.scrollTop=st}

  if(ghost){const fx=ghost.animate([{opacity:1,transform:"none"},{opacity:0,transform:`translateY(${toLyrics?-8:28}px) scale(.97)`}],{duration:D*.55,easing:"ease-out",fill:"forwards"});fx.onfinish=()=>ghost.remove();setTimeout(()=>ghost.remove(),D+200)}
  if(toEl){
    const B=toEl.getBoundingClientRect(), sx=A.width/B.width, sy=A.height/B.height;
    const bR=parseFloat(getComputedStyle(toEl).borderRadius)||24;
    toEl.style.position="relative"; toEl.style.zIndex="3";
    const an=toEl.animate([{transformOrigin:"0 0",transform:`translate(${A.left-B.left}px,${A.top-B.top}px) scale(${sx},${sy})`,borderRadius:`${aR/sx}px`},{transformOrigin:"0 0",transform:"none",borderRadius:`${bR}px`}],{duration:D,easing:ease});

  const appear=toLyrics?[p.querySelector("#lyr"),p.querySelector(".lyrhead .meta"),p.querySelector(".lyrhead #favBtn")]:[p.querySelector(".titleline")];
  appear.forEach((e,i)=>{if(e)e.animate([{opacity:0,transform:`translateY(${toLyrics&&i===0?22:10}px)`},{opacity:1,transform:"none"}],{duration:D*.7,delay:D*(toLyrics?.32:.38),easing:ease,fill:"backwards"})});

    const pendItems=st.feed.filter(f=>f.seg!==cur);

        if(!need.hadLyrics&&!out.lrc){const pl=bestMatch(ok.filter(x=>x.plainLyrics),tt,aa,dur,x=>({title:x.trackName,artist:x.artistName,dur:Math.round(x.duration||0)}));if(pl)out.lrc=pl.plainLyrics.slice(0,60000)}
      }catch(e){}
      if(T===t0&&A===a0)break;
    }
  }
  return out;
}

async function fillLibrary(){
  if(!META_HERE){toast("Esto solo funciona en la app instalada.");return}
  if(S.fillBusy||!S.db)return;
  if(!navigator.onLine){toast("Necesitas conexión a internet para buscar portadas y letras.");return}
  const todo=S.songs.filter(s=>!s.coverId||!parseLRC(s.lyrics||""));
  if(!todo.length){toast("Todas tus canciones ya tienen portada y letra sincronizada.");return}
  const F=S.fillBusy={done:0,total:todo.length,cov:0,lyr:0};render();
  for(const s of todo){
    if(!navigator.onLine)break;
    try{
      const needC=!s.coverId;
      const meta=await findMeta(s.title,s.artist,s.duration,{cover:needC,lyrics:!parseLRC(s.lyrics||""),hadLyrics:!!String(s.lyrics||"").trim()});
      if(meta.pic||meta.lrc){

        if(meta.lrc){up.lyrics=meta.lrc;F.lyr++}
        const cur=current();let oldAsset="";
        if(isMp3(s)&&!(cur&&cur.id===s.id)){
          try{const r=await blobFetch(s.assetId);
            if(r.ok){const old=new File([await r.blob()],s.file||"cancion.mp3",{type:"audio/mpeg"});
              const nf=await embedId3(old,{pic:meta.pic,lrc:meta.lrc});
              if(nf!==old){const a=await S.assets.upload(nf,{type:"audio/mpeg"});let af=null;try{af=await analyzeBytes(await nf.arrayBuffer(),true)}catch(e){}
                up.assetId=a.id;up.size=a.sizeBytes;up.af=af||null;oldAsset=s.assetId}}
          }catch(e){}
        }
        await S.db.collection("songs").doc(s.id).update(up);
        if(oldAsset)S.assets.delete(oldAsset).catch(()=>{});
      }
    }catch(e){}

  S.fillBusy=null;render();refreshUsage();
  const msg=metaSummary(F.cov,F.lyr);
  toast(msg?msg.charAt(0).toUpperCase()+msg.slice(1):(navigator.onLine?"No se ha encontrado nada nuevo para tus canciones.":"Se ha perdido la conexión. Prueba otra vez luego."));
}
async function uploadFiles(files,opts){
  if(!S.assets||!S.db){toast("No se puede subir ahora mismo. Cierra la app y vuelve a abrirla.");return}
  files=[...files]; if(!files.length)return; opts=opts||{};
  const metaN={cov:0,lyr:0};const dirCov=new Map(),fails=[],dups=[],seen=new Set(S.songs.map(x=>norm(x.title)+"|"+norm(x.artist)));
  for(let i=0;i<files.length;i++){
    const it=files[i]; S.uploading={done:i,total:files.length,name:it.name}; render();
    if(it.size>LIMIT_MB*1024*1024){fails.push(it.name+" (pesa más de "+LIMIT_MB+" MB)");continue}
    let f; try{f=it.get?await it.get():it}catch(e){fails.push(it.name+" (no se ha podido leer)");continue}
    try{
      const tags=await readTags(f);
      const fromName=cleanName(f.name);
      const title=(tags.title||"").trim()||metaClean(fromName.title)||fromName.title;
      const artist=(tags.artist||"").trim()||fromName.artist;
      const album=(tags.album||"").trim();
      const key=norm(title)+"|"+norm(artist);
      if(seen.has(key)||S.songs.some(x=>x.file===f.name&&x.size===f.size)){dups.push(artist?artist+" – "+title:title);continue}
      seen.add(key);
      {const needC=!tags.pic&&!it.cover,hasLrc=!!parseLRC(tags.lyrics||"");
       if(META_HERE&&navigator.onLine&&(needC||!hasLrc)){
         S.uploading={done:i,total:files.length,name:it.name+" (buscando portada y letra)"};render();
         try{const meta=await findMeta(title,artist,await getDuration(f),{cover:needC,lyrics:!hasLrc,hadLyrics:!!String(tags.lyrics||"").trim()});
           if((meta.pic||meta.lrc)&&fileIsMp3(f)){try{f=await embedId3(f,meta)}catch(e){}}
           if(meta.pic){tags.pic=meta.pic;metaN.cov++}
           if(meta.lrc){tags.lyrics=meta.lrc;metaN.lyr++}
         }catch(e){}
       }}
      const [r,dur,af]=await Promise.all([tryUpload(f),getDuration(f),fileAf(f)]);
      let coverId="",coverType="";
      if(tags.pic){try{const c=await S.assets.upload(new Blob([tags.pic.data],{type:tags.pic.mime}),{type:tags.pic.mime});coverId=c.id;coverType=c.contentType}catch(e){}}
      else if(it.cover){try{let c=dirCov.get(it.cover.key);if(!c){const img=await it.cover.item.get();c=await S.assets.upload(img,{type:img.type});dirCov.set(it.cover.key,c)}coverId=c.id;coverType=c.contentType}catch(e){}}
      await S.db.collection("songs").add({title,artist,album,coverId,coverType,lyrics:tags.lyrics||"",assetId:r.id,duration:dur,size:r.sizeBytes,createdAt:Date.now(),file:f.name,...(af?{af}:{})});
    }catch(e){
      const c=e&&e.code;
      fails.push(f.name+(c==="unsupported_type"?" (formato no admitido)":c==="quota_exceeded"?" (no queda espacio en el dispositivo)":c==="too_large"?" (demasiado grande)":""));
    }
  }
  S.uploading=null; render(); refreshUsage();
  // Las nuevas que no se hayan podido escuchar al subirlas se analizan solas para que entren en sus carpetas
  if(S.songs.some(x=>x.af))setTimeout(()=>{if(S.songs.some(needsAn))analyzeLibrary()},2500);
  const ok=files.length-fails.length-dups.length;
  if(opts.quiet&&!fails.length){toast(ok>0?(ok===1?"1 canción nueva añadida":ok+" canciones nuevas añadidas"):"No había canciones nuevas",4000);return}
  if(fails.length||(dups.length&&!opts.quiet)) showSheet(`<h3>${ok>0?(ok===1?"1 canción subida":ok+" canciones subidas"):"No se ha subido ninguna canción"}</h3>${dups.length?`<p style="margin:0 0 6px;font-weight:600">Ya las tenías, no se han vuelto a subir:</p><ul style="padding-left:18px;color:var(--muted);margin:0 0 16px">${dups.map(f=>`<li style="margin-bottom:6px">${esc(f)}</li>`).join("")}</ul>`:""}${fails.length?`<p style="margin:0 0 6px;font-weight:600">No se han podido subir:</p><ul style="padding-left:18px;color:var(--muted);margin:0 0 12px">${fails.map(f=>`<li style="margin-bottom:6px">${esc(f)}</li>`).join("")}</ul><p style="color:var(--muted);margin:0 0 16px;font-size:14px">Si el formato no está admitido, prueba a convertir la canción a M4A.</p>`:""}<div class="actions"><button class="btn" data-closesheet>Entendido</button></div>`);
  else{const mm=metaSummary(metaN.cov,metaN.lyr);toast((ok===1?"Canción subida":"Canciones subidas")+(mm?". "+mm.charAt(0).toUpperCase()+mm.slice(1):""))}
}

    bajon:.45*(1-maj)+.3*(1-T)+.25*(1-E),

  if(r[1][1]>=r[0][1]-.06&&bad[r[0][0]]!==r[1][0])out.push(r[1][0]);

}

/* ----- Análisis del sonido ----- */
const AN_SR=16000, AN_N=1024, AN_HOP=256, AN_SECS=60;
let FFTT=null;
function fftTables(){
  if(FFTT)return FFTT;
  const N=AN_N,bits=Math.log2(N),rev=new Uint32Array(N),cos=new Float32Array(N/2),sin=new Float32Array(N/2),win=new Float32Array(N);
  for(let i=0;i<N;i++){let r=0,x=i;for(let b=0;b<bits;b++){r=(r<<1)|(x&1);x>>=1}rev[i]=r;win[i]=.5-.5*Math.cos(2*Math.PI*i/(N-1))}

}
function fftMag(src,off,re,im,mag){
  const {rev,cos,sin,win}=fftTables(),N=AN_N;
  for(let i=0;i<N;i++){const j=rev[i];re[j]=src[off+i]*win[i];im[j]=0}
  for(let size=2;size<=N;size<<=1){const half=size>>1,step=N/size;
    for(let i=0;i<N;i+=size)for(let j=0,k=0;j<half;j++,k+=step){const a=i+j,b=a+half,tr=re[b]*cos[k]-im[b]*sin[k],ti=re[b]*sin[k]+im[b]*cos[k];re[b]=re[a]-tr;im[b]=im[a]-ti;re[a]+=tr;im[a]+=ti}}
  for(let k=0;k<N/2;k++)mag[k]=Math.hypot(re[k],im[k]);
}
function decodeAudio(buf){
  const C=window.OfflineAudioContext||window.webkitOfflineAudioContext;
  if(!C)return Promise.reject(new Error("sin Web Audio"));
  let ctx=null; for(const sr of [AN_SR,22050,44100]){try{ctx=new C(1,sr,sr);break}catch(e){}}
  if(!ctx)return Promise.reject(new Error("sin contexto"));
  return new Promise((res,rej)=>{try{const p=ctx.decodeAudioData(buf,res,rej);if(p&&p.then)p.then(res,rej)}catch(e){rej(e)}});
}
function toMono(ab){
  const sr=ab.sampleRate,ch=ab.numberOfChannels,len=ab.length,tot=len/sr;
  const seg=Math.min(tot,AN_SECS),st=tot>AN_SECS+10?(tot-AN_SECS)*.45:0;
  const s0=Math.floor(st*sr),ratio=sr/AN_SR,outN=Math.floor(seg*sr/ratio),out=new Float32Array(outN),cs=[];
  for(let c=0;c<ch;c++)cs.push(ab.getChannelData(c));
  for(let i=0;i<outN;i++){const a=s0+Math.floor(i*ratio),b=Math.min(len,Math.max(a+1,s0+Math.floor((i+1)*ratio)));let s=0,n=0;for(let j=a;j<b;j++){for(let c=0;c<ch;c++)s+=cs[c][j];n+=ch}out[i]=n?s/n:0}
  return out;
}
const KMAJ=[6.35,2.23,3.48,2.33,4.38,4.09,2.52,5.19,2.39,3.66,2.29,2.88],KMIN=[6.33,2.68,3.52,5.38,2.60,3.53,2.54,4.75,3.98,2.69,3.34,3.17];

  if(F<300)throw new Error("muy corta");
  const re=new Float32Array(N),im=new Float32Array(N),mag=new Float32Array(N/2),prev=new Float32Array(N/2),flux=new Float32Array(F),chroma=new Float64Array(12);
  const pcT=new Int8Array(N/2).fill(-1);
  for(let k=1;k<N/2;k++){const f=k*AN_SR/N;if(f>=110&&f<=3500)pcT[k]=((Math.round(12*Math.log2(f/440))+69)%12+12)%12}

    fftMag(x,f*H,re,im,mag);
    let fl=0,e=0,cs=0;
    for(let k=1;k<N/2;k++){const m=Math.log1p(100*mag[k]),d=m-prev[k];if(d>0)fl+=d;prev[k]=m;const p=mag[k]*mag[k];e+=p;cs+=p*k;if(pcT[k]>=0)chroma[pcT[k]]+=mag[k]}

  const lo=Math.floor(60*fps/200),hi=Math.ceil(60*fps/60),ac=new Float64Array(hi+2);
  for(let l=lo;l<=hi+1;l++){let s=0;for(let i=0;i+l<F;i++)s+=o[i]*o[i+l];ac[l]=s/(F-l)}

}

/* ----- Recomendación del momento ----- */
/* Una canción para ahora: sale de la carpeta que pega con la hora del día, evitando lo que
   acabas de escuchar y con más papeletas para tus favoritas. Cambia en cada franja del día
   (madrugada, mañana, tarde y noche) y con el botón de «otra». */

function recoSlot(){const h=new Date().getHours();return h<7?0:h<11?1:h<17?2:h<21?3:4}

function recoPick(){
  const {k,pool}=recoPool(); if(!pool.length)return null;
  const avoid=new Set(S.recent.slice(0,8)), cur=current();
  let cand=pool.filter(x=>!avoid.has(x.id)&&(!cur||x.id!==cur.id)); if(!cand.length)cand=pool;
  const key=dayKey(Date.now())+"|"+recoSlot()+"|"+(S.recoSeed||0);
  let best=null,bw=-1;
  for(const x of cand){const w=(hash(key+x.id)%10000)/10000*(x.fav?1.8:1);if(w>bw){bw=w;best=x}}
  return {song:best,k};
}

  const r=recoPick(); if(!r)return "";
  const x=r.song, m=r.k?moodOf(r.k):null, slot=["de madrugada","esta mañana","esta tarde","esta tarde","esta noche"][recoSlot()];
  const why=m?`${m.name}, ${slot}`:`Para ${slot}`;

async function loadNow(force){

    try{

  const o=document.createElement("div");o.className="toast toast-act";o.setAttribute("role","status");
  o.innerHTML=`<span>${esc(msg)}</span><button type="button">Deshacer</button>`;
  let done=false;const fin=()=>{if(done)return;done=true;clearTimeout(tm);o.remove();onExpire&&onExpire()};o._exp=fin;

  document.body.appendChild(o);
}

/* Lector: va a trozos sobre el archivo, sin cargarlo entero en memoria */
async function zipRead(file){

async function backupRestore(){
  const P=S.bkPending;if(!P)return;closeSheet();
  const B=S.bkBusy={kind:"load",step:"Restaurando…"};render();
  let bad=0,lastErr=null;
  try{
    const {z,data}=P,A=data.assets||[];let i=0;
    for(const a of A){i++;if(i===1||i%5===0||i===A.length){B.step=`Recuperando archivo ${i} de ${A.length}…`;render()}
      try{
        const sl=await z.blob("archivos/"+a.id);if(!sl){bad++;continue}
        /* Se lee entero y se guarda como archivo nuevo: Safari no deja guardar trozos del .zip elegido */
        const type=a.contentType||"application/octet-stream",bl=new Blob([await sl.arrayBuffer()],{type});
        await idb.put("assets",{id:a.id,data:bl,sizeBytes:a.sizeBytes||bl.size,contentType:type,createdAt:a.createdAt||Date.now()});
      }catch(e){bad++;lastErr=e;console.warn("archivo",a.id,e);if(e&&e.name==="QuotaExceededError")throw e}
      await new Promise(r=>setTimeout(r,0));
    }
    if(A.length&&bad===A.length)throw lastErr||new Error("ninguno");
    B.step="Recuperando canciones y listas…";render();
    for(const st of ["songs","playlists","state","plays"])for(const r of (data.stores[st]||[]))if(r&&r.id){try{await idb.put(st,r)}catch(e){lastErr=e;console.warn(st,e)}}
    for(const [k,v] of Object.entries(data.local||{}))if(BK_KEYS.includes(k))try{localStorage.setItem(k,v)}catch(e){}
    S.bkPending=null;
    toast(bad?`Copia restaurada, salvo ${bad===1?"1 archivo":bad+" archivos"} que no se ha podido leer. Reiniciando…`:"Copia restaurada. Reiniciando…");
    setTimeout(()=>location.reload(),bad?3500:1200);
  }catch(e){console.warn(e);S.bkBusy=null;render();
    toast(e&&e.name==="QuotaExceededError"?"No hay espacio suficiente en el dispositivo para restaurar la copia.":`No se ha podido restaurar la copia (${(e&&(e.name||e.message))||"error"}).`)}
}

/* ---------- Barra de progreso y botones al estilo de Apple Música ---------- */
/* La barra no tiene bolita: se toca o se arrastra en cualquier punto y se ensancha mientras
   la mueves. Mantener pulsado anterior o siguiente retrocede o avanza rápido. */
const HOLD={t:0,iv:0,used:false};
function seekFromX(el,x){const r=el.getBoundingClientRect();const v=Math.round(Math.max(0,Math.min(1,(x-r.left)/r.width))*1000);el.value=v;el.dispatchEvent(new Event("input",{bubbles:true}))}
document.addEventListener("pointerdown",e=>{
  const sk=e.target.closest&&e.target.closest("#seek");
  if(sk){
    e.preventDefault(); sk.classList.add("on"); try{sk.setPointerCapture(e.pointerId)}catch(_){}
    seekFromX(sk,e.clientX);
    const mv=ev=>seekFromX(sk,ev.clientX);
    const up=()=>{sk.removeEventListener("pointermove",mv);sk.removeEventListener("pointerup",up);sk.removeEventListener("pointercancel",up);sk.classList.remove("on");sk.dispatchEvent(new Event("change",{bubbles:true}))};
    sk.addEventListener("pointermove",mv); sk.addEventListener("pointerup",up); sk.addEventListener("pointercancel",up);
    return;
  }
  const b=e.target.closest&&e.target.closest("#prevBtn,#nextBtn"); if(!b)return;
  const dir=b.id==="nextBtn"?1:-1; HOLD.used=false; clearTimeout(HOLD.t); clearInterval(HOLD.iv);
  HOLD.t=setTimeout(()=>{HOLD.used=true;HOLD.iv=setInterval(()=>{const d=tDur()||0;const n=Math.max(0,Math.min(d-1,tNow()+dir*3));seekTo(n);updateTime()},160)},380);
  const stop=()=>{clearTimeout(HOLD.t);clearInterval(HOLD.iv);b.removeEventListener("pointerup",stop);b.removeEventListener("pointerleave",stop);b.removeEventListener("pointercancel",stop)};
  b.addEventListener("pointerup",stop); b.addEventListener("pointerleave",stop); b.addEventListener("pointercancel",stop);
});
document.addEventListener("contextmenu",e=>{if(e.target.closest&&e.target.closest("#prevBtn,#nextBtn,#seek"))e.preventDefault()});

/* ---------- Historial de escuchas (para el Wrapped) ---------- */
/* Cuenta como escucha cada canción que suena al menos 30 s. Se guarda un documento por día
   en la colección "plays" (plays/2026-11-05), con todas las escuchas de ese día. */
const MIN_PLAY=30, FIRST_YEAR=2026;
const MES=["enero","febrero","marzo","abril","mayo","junio","julio","agosto","septiembre","octubre","noviembre","diciembre"];
const DIAS=["los lunes","los martes","los miércoles","los jueves","los viernes","los sábados","los domingos"];
const cap=s=>s.charAt(0).toUpperCase()+s.slice(1);
const p2=n=>String(n).padStart(2,"0");
const dayKey=ts=>{const d=new Date(ts);return d.getFullYear()+"-"+p2(d.getMonth()+1)+"-"+p2(d.getDate())};
const fmtN=n=>Math.round(n).toLocaleString("es-ES");
const hm=s=>{const m=Math.round(s/60);if(m<60)return m+" min";const h=Math.floor(m/60),r=m%60;return h+" h"+(r?" "+r+" min":"")};
const dayTxt=k=>(+k.slice(8))+" de "+MES[+k.slice(5,7)-1];
let PL=null, plTick=0, plPos=0;
let pend={}; try{pend=JSON.parse(localStorage.getItem("playsPending")||"{}")||{}}catch(e){pend={}}
function savePend(){try{localStorage.setItem("playsPending",JSON.stringify(pend))}catch(e){}}
function recordPlay(){
  if(!PL||PL.secs<MIN_PLAY)return;
  const k=dayKey(PL.at);
  (pend[k]=pend[k]||{})[PL.at+"_"+PL.id]={s:PL.id,t:PL.at,d:Math.round(PL.secs),ti:PL.ti,ar:PL.ar,al:PL.al};
  savePend(); PL.rec=Date.now();
}
function trackTick(){
  const now=Date.now(), s=current();

function svChorusStart(s){
  const L=lrcFor(s);if(!L)return null;
  const cnt=new Map();L.forEach(l=>{const k=frNorm(l.text);if(k.length>6)cnt.set(k,(cnt.get(k)||0)+1)});
  let best=null,bc=1;for(const [k,c] of cnt)if(c>bc){bc=c;best=k}
  if(!best)return null;
  const hit=L.find(l=>frNorm(l.text)===best&&l.t>=12)||L.find(l=>frNorm(l.text)===best);
  return hit?Math.max(0,hit.t-0.4):null;
}
async function svEnergyStart(s,dur){

    const ac=new (window.AudioContext||window.webkitAudioContext)();
    const buf=await ac.decodeAudioData(await r.arrayBuffer());try{ac.close()}catch(e){}
    const ch=buf.getChannelData(0),sr=buf.sampleRate,n=Math.floor(ch.length/sr),E=[];

const SILENT="data:audio/wav;base64,UklGRiQAAABXQVZFZm10IBAAAAABAAEAQB8AAEAfAAABAAgAZGF0YQAAAAA=";
function storyOpen(uid){
  const order=[];if(svHas(AMI.me.id))order.push(AMI.me.id);

  if(!order.includes(uid))return;

    if(md.au){const au=URL.createObjectURL(md.au);SV.urls.push(au);SV.audio.src=au;SV.audio.currentTime=0;if(!SV.held)SV.audio.play().catch(()=>{})}
  }catch(e){const box=document.getElementById("svImg");if(box)box.innerHTML=`<p class="fs-hint">Esta historia ya no está disponible.</p>`}
  SV.t=performance.now();SV.bar=w.querySelectorAll(".sv-bars i")[SV.si];

function svLoop(now){if(!document.querySelector(".sv-wrap")||SV.held)return;const p=Math.min(1,(now-SV.t)/(ST_MAX*1000));if(SV.bar)SV.bar.style.width=p*100+"%";if(p>=1){svStep(1);return}SV.raf=requestAnimationFrame(svLoop)}
function svPause(){if(SV.held)return;SV.held=true;SV.el=performance.now()-SV.t;cancelAnimationFrame(SV.raf);if(SV.audio){try{SV.audio.pause()}catch(e){}}}
function svResume(){if(!SV.held)return;SV.held=false;SV.t=performance.now()-(SV.el||0);if(SV.audio&&SV.audio.src&&SV.audio.src!==SILENT)SV.audio.play().catch(()=>{});cancelAnimationFrame(SV.raf);SV.raf=requestAnimationFrame(svLoop)}

const SVG={on:false};
document.addEventListener("pointerdown",e=>{
  const z=e.target.closest&&e.target.closest(".sv-touch");if(!z||!e.isPrimary)return;
  const w=z.closest(".sv-wrap");if(!w)return;
  Object.assign(SVG,{on:true,x:e.clientX,y:e.clientY,dx:0,dy:0,ax:null,hold:false,w});
  try{z.setPointerCapture(e.pointerId)}catch(_){}
  clearTimeout(SVG.tm);SVG.tm=setTimeout(()=>{if(SVG.on&&!SVG.ax){SVG.hold=true;svPause();w.classList.add("hold")}},220);
});
document.addEventListener("pointermove",e=>{
  if(!SVG.on)return;SVG.dx=e.clientX-SVG.x;SVG.dy=e.clientY-SVG.y;
  if(!SVG.ax&&Math.hypot(SVG.dx,SVG.dy)>10){SVG.ax=Math.abs(SVG.dy)>Math.abs(SVG.dx)?"y":"x";clearTimeout(SVG.tm);svPause()}
  const w=SVG.w;
  if(SVG.ax==="y"){const d=SVG.dy;if(d>=0){w.style.transform=`translateY(${d}px) scale(${Math.max(.86,1-d/1600)})`;w.style.borderRadius=Math.min(24,d/5)+"px"}else{w.style.transform=`translateY(${Math.max(d,-90)*.25}px)`;w.style.borderRadius=""}w.classList.add("drag")}
  else if(SVG.ax==="x"){w.style.transform=`translateX(${SVG.dx*.4}px)`;w.classList.add("drag")}
});
function svGestEnd(e,cancel){
  if(!SVG.on)return;SVG.on=false;clearTimeout(SVG.tm);
  const w=SVG.w;w.classList.remove("hold","drag");
  const back=()=>{w.classList.add("snap");w.style.transform="";w.style.borderRadius="";setTimeout(()=>w.classList.remove("snap"),240)};
  if(cancel){back();svResume();return}
  if(SVG.ax==="y"){
    if(SVG.dy>110){w.classList.add("snap");w.style.transform="translateY(100vh) scale(.86)";setTimeout(svClose,200);return}
    back();
    if(SVG.dy<-60&&SV.list[SV.ui]===AMI.me.id){const it=(SV.stories.get(AMI.me.id)||[])[SV.si];if(it){svViewsOpen(it.id);return}}
    svResume();return;
  }
  if(SVG.ax==="x"){back();if(Math.abs(SVG.dx)>60)svUserStep(SVG.dx<0?1:-1);else svResume();return}
  if(SVG.hold){svResume();return}
  const r=w.getBoundingClientRect();svStep(e.clientX-r.left<r.width*.3?-1:1);
}
document.addEventListener("pointerup",e=>svGestEnd(e,false));

/* ---------- Compatibilidad musical con amigos ----------
   Cada app sube un resumen pequeño (artistas y canciones más escuchados de los últimos 6 meses,
   con nombres normalizados). Solo lo leen tus amigos. Tu historial completo sigue siendo privado. */
const TASTE={mine:null,cache:new Map()};
const tasteOn=()=>{try{return localStorage.getItem("tasteShare")!=="0"}catch(e){return true}};
const tKey=(t,a)=>frNorm(t)+"|"+frNorm((splitArtists(a||"")[0])||a||"");
async function tasteBuild(){
  const now=Date.now(),from=now-180*864e5,y=new Date().getFullYear();
  let list=[];
  for(const yy of [y-1,y]){if(new Date(yy,11,31).getTime()<from)continue;try{list=list.concat(await fetchYear(yy))}catch(e){}}
  list=list.filter(e=>e.t>=from);
  const st=wStats(list);
  const artists=st.artists.slice(0,40).map(a=>({k:frNorm(a.name),n:a.name,w:Math.max(1,Math.round(a.d/60))})).filter(a=>a.k);
  const songs=st.songs.slice(0,40).map(x=>({k:tKey(x.title,x.artist),t:x.title,a:x.artist,w:x.n})).filter(x=>x.k.length>1);
  const wk=list.filter(e=>e.t>=now-7*864e5),ws=wStats(wk);
  const week=ws.songs.slice(0,30).map(x=>({k:tKey(x.title,x.artist),t:x.title,a:x.artist,w:x.n})).filter(x=>x.k.length>1);
  return {artists,songs,week,plays:list.length};
}
async function tasteSync(force){
  if(!SBC||!AMI.me||!S.db||!tasteOn())return;
  const k="tasteAt2:"+AMI.me.id;let at=0;try{at=+localStorage.getItem(k)||0}catch(e){}
  if(!force&&TASTE.mine&&Date.now()-at<6*36e5)return;
  try{
    TASTE.mine=await tasteBuild();
    if(!force&&Date.now()-at<6*36e5)return;
    const {error}=await SBC.from("taste_summary").upsert({user_id:AMI.me.id,artists:TASTE.mine.artists,songs:TASTE.mine.songs,week:TASTE.mine.week,plays:TASTE.mine.plays,updated_at:new Date().toISOString()});
    if(!error)try{localStorage.setItem(k,String(Date.now()))}catch(e){}
  }catch(e){}
}
async function tasteToggle(){
  const on=!tasteOn();try{localStorage.setItem("tasteShare",on?"1":"0")}catch(e){}
  if(on){tasteSync(true).then(()=>{FC.at=0;if(S.tab==="ahora")render()});toast("Tus amigos ya pueden ver vuestra compatibilidad")}
  else{TASTE.cache.clear();try{localStorage.removeItem("tasteAt2:"+AMI.me.id)}catch(e){}
    try{await SBC.from("taste_summary").delete().eq("user_id",AMI.me.id)}catch(e){}
    toast("Has dejado de compartir tus gustos")}
  render();
}
function tasteScore(a,b){
  const vec=l=>{const m=new Map();for(const o of l)m.set(o.k,(m.get(o.k)||0)+o.w);return m};
  const cos=(x,y)=>{const A=vec(x),B=vec(y);let d=0,na=0,nb=0;for(const[k,v]of A){const u=Math.sqrt(v);na+=u*u;if(B.has(k))d+=u*Math.sqrt(B.get(k))}for(const v of B.values())nb+=v;return na&&nb?d/Math.sqrt(na*nb):0};

const ST_B="stories",SVC_NAME="stories-v1";
const svCK=(id,k)=>"/__st/"+encodeURIComponent(id)+"/"+k;
async function svCacheGet(id){

  }catch(e){return null}
}

}

// Audio ligero: MP3 mono a 64 kbps (unos 120 KB por historia en vez de 300–600 KB)
let LAME=null;
function lameLoad(){
  if(window.lamejs)return Promise.resolve(window.lamejs);if(LAME)return LAME;
  LAME=new Promise((res,rej)=>{const sc=document.createElement("script");sc.src="https://cdn.jsdelivr.net/npm/lamejs@1.2.1/lame.min.js";sc.onload=()=>window.lamejs?res(window.lamejs):rej(new Error("lame"));sc.onerror=()=>{LAME=null;rej(new Error("lame"))};document.head.appendChild(sc)});

async function svClipLight(s,start){
  const raw=await svClip(s,start);
  try{
    const lame=await lameLoad();
    const ac=new (window.AudioContext||window.webkitAudioContext)();let buf;
    try{buf=await ac.decodeAudioData(await raw.arrayBuffer())}finally{try{ac.close()}catch(e){}}
    const SR=22050,src=buf.sampleRate,r=src/SR,n=Math.floor(buf.length/r),chs=[...Array(buf.numberOfChannels)].map((_,i)=>buf.getChannelData(i)),pcm=new Int16Array(n),fd=Math.min(1100,n/4);
    for(let i=0;i<n;i++){const a=Math.floor(i*r),b=Math.max(a+1,Math.floor((i+1)*r));let v=0,c=0;for(const ch of chs)for(let k=a;k<b&&k<buf.length;k++){v+=ch[k];c++}v=c?v/c:0;const f=Math.min(1,i/fd,(n-i)/fd);pcm[i]=Math.max(-1,Math.min(1,v*f))*32767}

    for(let i=0;i<n;i+=1152){const o=enc.encodeBuffer(pcm.subarray(i,i+1152));if(o.length)out.push(new Uint8Array(o))}
    const fl=enc.flush();if(fl.length)out.push(new Uint8Array(fl));

  }catch(e){return raw}
}

    return true;
  }
  if(lAt&&lAt>cAt)await clPushProfile();
  return false;
}
function mergePlays(a,b){
  const m=new Map((a||[]).map(e=>[e.t+"_"+e.s,e]));
  for(const e of (b||[])){const k=e.t+"_"+e.s,o=m.get(k);if(!o||(e.d||0)>(o.d||0))m.set(k,e)}
  return [...m.values()].sort((x,y)=>x.t-y.t);
}
const playsSig=l=>(l||[]).length+":"+(l||[]).reduce((n,e)=>n+(e.d||0),0);
async function clPullPlays(){
  const uid=AMI.me.id;let since=localStorage.getItem(clKey())||"";
  if(!since){const snap=await S.db.collection("plays").get();for(const d of snap.docs)CL.dirty.add(d.id);clSaveDirty()}
  let from=0,changed=false,maxAt=since;
  for(;;){
    let q=SBC.from("play_days").select("day,plays,updated_at").eq("user_id",uid).order("updated_at").range(from,from+199);
    if(since)q=q.gt("updated_at",new Date(Date.parse(since)-120000).toISOString());
    const {data,error}=await q;if(error)throw error;
    for(const r of data||[]){
      const ref=S.db.doc("plays/"+r.day),d=await ref.get(),loc=(d.exists&&d.data().plays)||[];
      const merged=mergePlays(loc,r.plays);
      if(playsSig(merged)!==playsSig(loc)){await ref.set({day:r.day,month:r.day.slice(0,7),year:+r.day.slice(0,4),plays:merged});changed=true}
      if(playsSig(merged)!==playsSig(r.plays))CL.dirty.add(r.day);
      if(!maxAt||r.updated_at>maxAt)maxAt=r.updated_at;
    }
    if(!data||data.length<200)break;from+=200;
  }
  if(maxAt)try{localStorage.setItem(clKey(),maxAt)}catch(e){}
  clSaveDirty();
  return changed;
}
async function clPushPlays(){
  if(!SBC||!AMI.me||!S.db||!CL.dirty.size)return;
  const uid=AMI.me.id,days=[...CL.dirty];
  for(let i=0;i<days.length;i+=30){
    const part=days.slice(i,i+30),rows=[];
    for(const k of part){const d=await S.db.doc("plays/"+k).get();if(d.exists)rows.push({user_id:uid,day:k,plays:d.data().plays||[]})}
    if(rows.length){const {error}=await SBC.from("play_days").upsert(rows);if(error)return}
    part.forEach(k=>CL.dirty.delete(k));clSaveDirty();
  }
}
async function cloudSync(){
  if(SBC&&AMI.me&&!S.db){setTimeout(cloudSync,3000);return}
  if(!SBC||!AMI.me||!S.db||CL.busy)return;CL.busy=true;
  try{
    const p=await clSyncProfile();
    const c=await clPullPlays();
    await clPushPlays();
    if(c){for(const y in WR.data)delete WR.data[y];loadLoop()}
    if(p||c)frRerender();
  }catch(e){}
  CL.busy=false;
  tasteSync(false);
}
/* Fotos de los amigos: solo se descargan cuando cambian */
let FAV={};try{FAV=JSON.parse(localStorage.getItem("frAv")||"{}")||{}}catch(e){FAV={}}
async function frLoadAvatars(ids){
  if(!ids.length)return;
  try{
    const {data}=await SBC.from("avatars").select("user_id,updated_at").in("user_id",ids);
    const need=(data||[]).filter(r=>!FAV[r.user_id]||FAV[r.user_id].at!==r.updated_at).map(r=>r.user_id);
    if(need.length){
      const {data:ph}=await SBC.from("avatars").select("user_id,photo,updated_at").in("user_id",need);
      for(const r of ph||[])FAV[r.user_id]={at:r.updated_at,photo:r.photo||""};
      try{localStorage.setItem("frAv",JSON.stringify(FAV))}catch(e){}
      frRerender();
    }
  }catch(e){}
}
const frPhoto=id=>(FAV[id]&&FAV[id].photo)||"";


(async()=>{
  try{
    await idb.init();
    try{if(navigator.storage&&navigator.storage.persist)navigator.storage.persist()}catch(e){}
    const db=localDb, assets=localAssets;
    S.db=db; S.assets=assets;
    if(!db){S.ready=true;render();return}
    flushPlays();
    setTimeout(()=>checkUpdate(false),4000);
    loadLoop();
    refreshUsage();
    db.doc("state/settings").get().then(d=>{if(d.exists){CFG={...CFG_DEF,...d.data()};try{localStorage.setItem("cfg",JSON.stringify(CFG))}catch(e){}applyCfg();eqApply();render();renderPlayer()}}).catch(()=>{});
    let gotS=false,gotP=false;
    setTimeout(()=>{if(!S.restored&&gotS)restoreSession()},5000);
    db.collection("songs").onSnapshot(snap=>{S.songs=snap.docs.map(d=>({id:d.id,...d.data()}));gotS=true;S.ready=gotS&&gotP;if(!snap.metadata||!snap.metadata.fromCache)restoreSession();render();renderPlayer()},()=>{S.ready=true;render()});
    db.collection("playlists").orderBy("createdAt","asc").onSnapshot(snap=>{S.playlists=snap.docs.map(d=>({id:d.id,...d.data()}));gotP=true;S.ready=gotS&&gotP;render()},()=>{gotP=true;S.ready=gotS;render()});
  }catch(err){S.ready=true;render()}
})();
})();
