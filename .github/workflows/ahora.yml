name: Actualizar ranking de Ahora
on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  actualizar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: curl -fsSL "https://rss.marketingtools.apple.com/api/v2/es/music/most-played/50/songs.json" -o ahora.json
      - run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add ahora.json
          git diff --staged --quiet || (git commit -m "Actualiza ranking de Ahora" && git push)
